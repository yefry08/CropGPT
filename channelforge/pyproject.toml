[project]
name = "channelforge"
version = "0.1.0"
description = "Desktop app that runs three automated YouTube channels end to end."
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "keyring>=25",
  "APScheduler>=3.10,<4",
  "PyYAML>=6",
  "yt-dlp>=2024.8",
  "faster-whisper>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[project.scripts]
channelforge = "channelforge.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["channelforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: exercises the real claude CLI (several seconds)"]
