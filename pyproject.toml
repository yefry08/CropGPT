[project]
name = "cropmatch"
version = "0.1.0"
description = "CropMatch Analog Engine: find a land parcel's biophysical twins and transfer the agronomic techniques that worked there."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pystac-client>=0.8",
    "rasterio>=1.4",
    "xarray>=2024.6",
    "rioxarray>=0.17",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "scipy>=1.13",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "reportlab>=4.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
