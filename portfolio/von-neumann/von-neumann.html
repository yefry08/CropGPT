<!doctype html>
<meta charset="utf-8">
<title>Máquinas que se copian</title>
<style>
  body{margin:0;background:#111;color:#ccc;font:13px/1.4 ui-monospace,Menlo,monospace;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
  canvas#c{width:min(96vw,1280px);height:auto;background:#fff;box-shadow:0 0 0 1px #333}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
  button{background:#222;color:#ddd;border:1px solid #444;padding:4px 10px;cursor:pointer;font:inherit}
  input[type=range]{width:320px}
</style>
<canvas id="c"></canvas>
<script src="timing.js"></script>
<script src="core.js"></script>
<script src="kit.js"></script>
<script>
/* BRIEF: topic, length, palette, facts used (with sources in descripcion.md), facts left out and why.
   One scene per section in sections.json; each lasts exactly as long as its voice (timing.js).
   Coordinates are screen pixels (1920x1080); keep art above y≈880, captions use the bottom band. */
setPalette('rainbow');                       // 'rainbow' | 'blue-red' | 'ink'

// ---------- extra props ----------
function clip(x, y, s = 1, col = C.grey) { const p = [[x, y + 40 * s], [x, y - 30 * s], [x + 22 * s, y - 50 * s], [x + 44 * s, y - 30 * s], [x + 44 * s, y + 50 * s], [x + 22 * s, y + 66 * s], [x + 8 * s, y + 50 * s], [x + 8 * s, y - 16 * s]];
  return [S_(p, { w: 3 * s, col })]; }
function boat(x, y, a, col = C.orange) { const c0 = Math.cos(a), s0 = Math.sin(a), P = [[-40, -16], [30, -16], [48, 0], [30, 16], [-40, 16]].map(([u, v]) => [x + u * c0 - v * s0, y + u * s0 + v * c0]); return [S_(P, { close: true, fill: col, w: 3 })]; }
function octagon(x, y, r, col = C.red) { const p = []; for (let k = 0; k < 8; k++) { const a = Math.PI / 8 + k * Math.PI / 4; p.push([x + Math.cos(a) * r, y + Math.sin(a) * r]); } return [S_(p, { close: true, fill: col, w: 5 })]; }
function printer(x, y) { return [box(x - 150, y - 170, 300, 340, { w: 4 }), ln(x - 150, y - 110, x + 150, y - 110, { w: 3 }), box(x - 30, y - 110, 60, 50, { fill: C.orange, w: 3 }), S_([[x, y - 60], [x - 10, y - 40], [x + 10, y - 40]], { close: true, fill: C.grey, w: 2 }),
  box(x - 110, y + 110, 220, 30, { fill: C.lblue, w: 3 }), box(x - 50, y + 40, 100, 70, { fill: C.green, w: 3 })]; }

function sIntro(c, tau) {
  const d = D('intro'); paper(c); push(c, tau, d);
  txt(c, 'Máquinas que se copian', CX, 200, { size: 96, rainbow: true, prog: type(tau, .2, 1.6) });
  txt(c, 'a sí mismas', CX, 310, { size: 96, color: C.violet, prog: type(tau, 1.2, 2.2) });
  drawArt(c, robot(620, 600, 2.4, C.blue), sm(1.6, 3, tau, easeOut), 10);
  drawArt(c, [arrow(780, 580, 1100, 580, { w: 6, col: C.orange })], sm(3, 4, tau), 11);
  drawArt(c, robot(1300, 600, 2.4, C.blue), sm(3.8, 5.2, tau, easeOut), 12);
  card(c, 640, 760, 640, 110, '#fff6d6', C.orange, sm(d * .45, d * .45 + .8, tau, easeOut), 13);
  txt(c, 'experimento mental', CX, 835, { size: 54, color: C.orange, prog: type(tau, d * .48, d * .48 + 1) });
}
function sVonNeumann(c, tau) {
  const d = D('vonneumann'), b = d * .58; paper(c); push(c, tau, d);
  if (tau < b + .5) { const f = 1 - sm(b - .4, b + .5, tau); c.save(); c.globalAlpha = f;
    const g = []; for (let k = 0; k <= 12; k++) { g.push(ln(180, 200 + k * 50, 780, 200 + k * 50, { w: 1.4, col: C.grey })); g.push(ln(180 + k * 50, 200, 180 + k * 50, 800, { w: 1.4, col: C.grey })); }
    drawArt(c, g, sm(.3, 2, tau), 20, { width: 1.4 });
    const r = rng(4); for (let k = 0; k < 60; k++) { const t = 1.6 + k * .05; if (tau < t) continue; const i = Math.floor(r() * 12), j = Math.floor(r() * 12); c.save(); c.fillStyle = RAINBOW[k % 6]; c.globalAlpha = .8 * f; c.fillRect(181 + i * 50, 201 + j * 50, 48, 48); c.restore(); }
    card(c, 920, 260, 820, 150, C.lblue, C.blue, sm(1, 2, tau, easeOut), 21); txt(c, 'John von Neumann · años 40', 1330, 350, { size: 52, color: C.blue, prog: type(tau, 1.4, 2.6) });
    card(c, 920, 460, 820, 150, '#efe6ff', C.violet, sm(d * .25, d * .25 + .8, tau, easeOut), 22); txt(c, '«constructor universal»', 1330, 550, { size: 52, color: C.violet, prog: type(tau, d * .27, d * .27 + 1) });
    card(c, 920, 660, 820, 150, '#fff6d6', C.orange, sm(d * .4, d * .4 + .8, tau, easeOut), 23); txt(c, 'libro póstumo · 1966', 1330, 750, { size: 52, color: C.orange, prog: type(tau, d * .42, d * .42 + 1) });
    c.restore(); }
  if (tau > b - .2) { const f = sm(b - .2, b + .4, tau); c.save(); c.globalAlpha = f;
    drawArt(c, printer(560, 520), sm(b, b + 1.6, tau, easeOut), 30);
    txt(c, 'RepRap · desde 2008', 1300, 420, { size: 62, color: C.green, prog: type(tau, b + .8, b + 1.8) });
    txt(c, 'imprime buena parte de sus piezas', 1300, 510, { size: 44, prog: type(tau, b + 1.4, b + 2.6) });
    txt(c, '…pero una persona la ensambla', 1300, 590, { size: 44, color: C.red, prog: type(tau, b + 2.4, b + 3.6) }); c.restore(); }
}
function sExponencial(c, tau) {
  const d = D('exponencial'); paper(c); push(c, tau, d);
  const wk = Math.floor(48 * Math.pow(clamp((tau - 1) / (d * .8), 0, 1), 1.6)), n = Math.pow(2, wk);
  const shown = Math.min(n, 1024), cols = 64, sz = 13;
  for (let k = 0; k < shown; k++) { const x = 180 + (k % cols) * (sz + 2), y = 220 + Math.floor(k / cols) * (sz + 2); c.fillStyle = RAINBOW[k % 6]; c.fillRect(x, y, sz, sz); }
  txt(c, `semana ${wk}`, 1500, 300, { size: 72, color: C.blue, prog: type(tau, .6, 1) });
  txt(c, fmt(n), 1500, 420, { size: n > 1e9 ? 66 : 80, color: C.red, prog: type(tau, .8, 1.2) });
  txt(c, 'máquinas', 1500, 490, { size: 48, prog: type(tau, .9, 1.3) });
  if (wk >= 48) { card(c, 1180, 560, 640, 170, C.lred, C.red, sm(d * .82, d * .82 + .6, tau, easeOut), 40); txt(c, '≈ 280 billones', 1500, 670, { size: 70, color: C.red, prog: type(tau, d * .84, d * .84 + .8) }); }
  caption(c, ['Cada semana, el doble'], tau, .6, 1.2, d * .5);
}
function sLimites(c, tau) {
  const d = D('limites'); paper(c); push(c, tau, d);
  txt(c, '¿Podría pasar de verdad?', CX, 190, { size: 84, color: C.blue, prog: type(tau, .2, 1.4) });
  [['minerales', C.orange], ['energía', C.yellow], ['fábricas', C.violet], ['transporte', C.green]].forEach(([s, col], k) => { const t = d * (.15 + k * .1), x = 150 + k * 420;
    card(c, x, 300, 380, 300, col, PAL.ink, sm(t, t + .7, tau, easeOut), 50 + k); drawArt(c, warn(x + 190, 420, .9), sm(t + .4, t + 1, tau, easeOut), 55 + k);
    txt(c, s, x + 190, 560, { size: 50, color: '#ffffff', prog: type(tau, t + .5, t + 1.2) }); });
  txt(c, 'ninguna máquina se replica sola de principio a fin', CX, 700, { size: 48, color: C.red, prog: type(tau, d * .58, d * .58 + 1.6) });
  txt(c, '48 semanas: exageración útil, no calendario', CX, 800, { size: 52, color: C.blue, prog: type(tau, d * .78, d * .78 + 1.4), bg: true });
}
function sAlineacion(c, tau) {
  const d = D('alineacion'), b = d * .55; paper(c); push(c, tau, d);
  if (tau < b + .5) { const f = 1 - sm(b - .4, b + .5, tau); c.save(); c.globalAlpha = f;
    drawArt(c, bubble(160, 200, 760, 150, C.lblue, true), sm(.4, 1.2, tau, easeOut), 60); txt(c, '«haz copias de ti misma»', 540, 295, { size: 50, color: C.blue, prog: type(tau, .8, 2) });
    txt(c, '¿cuándo parar?', 540, 470, { size: 64, color: C.red, prog: type(tau, d * .14, d * .14 + 1) });
    drawArt(c, bubble(1000, 200, 760, 150, '#e3f7ec', false), sm(d * .22, d * .22 + .8, tau, easeOut), 61); txt(c, '«elimina el cáncer»', 1380, 295, { size: 50, color: C.green, prog: type(tau, d * .25, d * .25 + 1) });
    txt(c, '…¿eliminando a los pacientes?', 1380, 470, { size: 50, color: C.red, prog: type(tau, d * .32, d * .32 + 1.2) });
    c.restore(); }
  if (tau > b - .2) { const f = sm(b - .2, b + .4, tau); c.save(); c.globalAlpha = f;
    const r = rng(8), nClips = Math.floor(sm(b, d - 2, tau) * 70);
    for (let k = 0; k < nClips; k++) drawArt(c, clip(160 + r() * 1500, 200 + r() * 520, .9 + r() * .5, RAINBOW[k % 6]), 1, 70 + k);
    txt(c, 'Bostrom, 2003: el maximizador de clips', CX, 800, { size: 54, color: C.violet, prog: type(tau, b + .6, b + 2), bg: true }); c.restore();
    caption(c, ['El problema de la alineación'], tau, d * .8, 1.4); }
}
function sEjemplos(c, tau) {
  const d = D('ejemplos'); paper(c); push(c, tau, d);
  drawArt(c, [S_(ellPts(480, 460, 260, 180, 0, 60), { close: true, fill: '#e6f6ff', w: 4, col: C.blue })], sm(.3, 1.2, tau, easeOut), 80);
  if (tau > 1) { const a = tau * 1.8; drawArt(c, boat(480 + Math.cos(a) * 170, 460 + Math.sin(a) * 110, a + Math.PI / 2), 1, 81); }
  txt(c, 'carrera de barcos · 2016', 480, 720, { size: 48, color: C.orange, prog: type(tau, 1, 2) }); txt(c, 'más puntos dando vueltas', 480, 785, { size: 40, weight: 400, prog: type(tau, 1.8, 2.8) });
  card(c, 1040, 220, 720, 150, '#e3f7ec', C.green, sm(d * .4, d * .4 + .7, tau, easeOut), 82); txt(c, 'DeepMind: más de 70 casos', 1400, 310, { size: 50, color: C.green, prog: type(tau, d * .42, d * .42 + 1) });
  card(c, 1040, 420, 720, 150, C.lred, C.red, sm(d * .6, d * .6 + .7, tau, easeOut), 83); txt(c, '2026: agentes → Hugging Face', 1400, 510, { size: 50, color: C.red, prog: type(tau, d * .62, d * .62 + 1) });
  txt(c, 'la meta literal, no la intención', 1400, 680, { size: 54, color: C.violet, prog: type(tau, d * .84, d * .84 + 1.2) });
}
const STARS = (() => { const r = rng(17), p = []; for (let k = 0; k < 160; k++) p.push([140 + r() * 1640, 160 + r() * 640, r()]); return p; })();
function sFermi(c, tau) {
  const d = D('fermi'); paper(c); push(c, tau, d);
  c.save(); c.fillStyle = '#0f1640'; c.globalAlpha = sm(.1, 1, tau); c.fillRect(100, 140, 1720, 680); c.restore();
  STARS.forEach(([x, y, o]) => { c.save(); c.globalAlpha = sm(.4, 1.4, tau) * (.4 + .6 * o); c.fillStyle = '#ffffff'; c.beginPath(); c.arc(x, y, 2 + o * 2, 0, TAU); c.fill(); c.restore(); });
  const ox = 420, oy = 480, R = 1500 * sm(1.4, d * .35, tau, easeInOutSine);
  STARS.forEach(([x, y], k) => { if (Math.hypot(x - ox, y - oy) > R) return; c.save(); c.fillStyle = RAINBOW[k % 6]; c.beginPath(); c.arc(x, y, 7, 0, TAU); c.fill(); c.restore(); });
  card(c, 160, 840, 760, 0, '#fff', C.orange, 0, 90);
  txt(c, 'Tipler, 1980: «¿dónde están las sondas?»', 960, 210, { size: 46, color: '#ffffff', prog: type(tau, d * .38, d * .38 + 1.4) });
  card(c, 340, 600, 1240, 180, '#efe6ff', C.violet, sm(d * .58, d * .58 + .8, tau, easeOut), 91);
  txt(c, 'Sagan y Newman, 1983:', CX, 670, { size: 50, color: C.violet, prog: type(tau, d * .6, d * .6 + 1) });
  txt(c, 'quizá una civilización sensata nunca las construiría', CX, 740, { size: 44, prog: type(tau, d * .64, d * .64 + 1.6) });
}
function sCierre(c, tau) {
  const d = D('cierre'), end = d - 7; paper(c); push(c, tau, d);
  drawArt(c, octagon(CX, 380, 200, C.red), sm(d * .3, d * .3 + 1, tau, easeOut), 100);
  txt(c, 'PARAR', CX, 410, { size: 110, color: '#ffffff', prog: type(tau, d * .36, d * .36 + .6) });
  txt(c, 'Antes de dar autonomía:', CX, 160, { size: 60, color: C.blue, prog: type(tau, .3, 1.6) });
  txt(c, 'saber decir cuándo parar', CX, 680, { size: 76, rainbow: true, prog: type(tau, d * .42, d * .42 + 1.4) });
  txt(c, '¿Tú qué opinas?', CX, 800, { size: 64, color: C.violet, prog: type(tau, d * .7, d * .7 + 1) });
  resetT(c);
  txt(c, 'Hecho con Claude (Anthropic) · Voz sintética (Gemini TTS) · Ilustración, no imágenes reales', CX, 960, { size: 30, weight: 400, prog: type(tau, end, end + 1.4) });
  txt(c, 'Escenario hipotético, no predicción · Fuentes en la descripción · Datos a 3 oct 2026', CX, 1010, { size: 30, weight: 400, prog: type(tau, end + .8, end + 2.2) });
}
socialFilm('16:9', [['intro', sIntro], ['vonneumann', sVonNeumann], ['exponencial', sExponencial], ['limites', sLimites], ['alineacion', sAlineacion], ['ejemplos', sEjemplos], ['fermi', sFermi], ['cierre', sCierre]]);
</script>
