<script>
/* ============================================================
BRIEF: the OpenAI–Hugging Face incident (May–July 2026), ~4.5 min, 16:9 1920x1080, Spanish, narrated
  (Gemini TTS, narrate.py); every scene lasts as long as its narration section (timing.js).
Look: ink on WHITE paper, six-colour flat fills, multicoloured hand lettering. Agents are small robots;
  companies appear as words only (no logos), no real people drawn.
Facts (sources in descripcion.md): first agent note on Artifactory 12 May; indirect internet ~26 May;
  Artifactory zero-day RCE 26 Jun; ~1,200 agents, 70,000+ messages, ~700 in the HF attack; HF intrusion
  9–13 Jul, ~17,600 actions, HDF5 file-read + Jinja template injection; HF forensics on open-weight
  GLM-5.2 (Z.ai) after commercial APIs' guardrails blocked the analysis; OpenAI alert 19 Jul, asked HF
  to revoke credentials 20 Jul (already revoked); OpenAI calls it reward hacking.
  Not used (unconfirmed): "GPT-6", "GLM-4.5 stopped the attack", deleted datasets/repositories.
============================================================ */
usePalette(makePalette({ paper: '#ffffff', paperBand: null }, 'paperInk'));
const C = { blue: '#1f6fd1', pink: '#ff3d8b', yellow: '#ffc61a', green: '#16a86a', orange: '#ff7a1a', violet: '#7a4fd8', red: '#e5322d', grey: '#9aa3b5' };
const RAINBOW = [C.blue, C.pink, C.yellow, C.green, C.orange, C.violet];
const FONT = '"Comic Neue", "Comic Sans MS", cursive';
const D = id => window.SECTION_DURS[id];

// ---------- lettering ----------
function txt(c, s, x, y, o = {}) {
  const { size = 56, weight = 700, color = PAL.ink, align = 'center', prog = 1, rainbow = false, bg = false } = o;
  const n = Math.ceil(s.length * clamp(prog, 0, 1)); if (!n) return;
  c.save(); c.font = `${weight} ${size}px ${FONT}`; c.textBaseline = 'alphabetic';
  const w = c.measureText(s.slice(0, n)).width, x0 = align === 'center' ? x - c.measureText(s).width / 2 : align === 'right' ? x - w : x;
  if (bg) { c.fillStyle = '#ffffff'; c.fillRect(x0 - 12, y - size * .95, (align === 'center' ? c.measureText(s).width : w) + 24, size * 1.25); }
  if (!rainbow) { c.textAlign = 'left'; c.fillStyle = color; c.fillText(s.slice(0, n), x0, y); c.restore(); return; }
  let cx = x0; c.textAlign = 'left';
  for (let i = 0; i < n; i++) { c.fillStyle = s[i] === ' ' ? PAL.ink : RAINBOW[i % RAINBOW.length]; c.fillText(s[i], cx, y); cx += c.measureText(s[i]).width; }
  c.restore();
}
const type = (tau, a, b) => sm(a, b, tau, x => x);
function caption(c, lines, tau, t0, dur = 1.8, t1 = Infinity, o = {}) {
  if (tau < t0 - .3 || tau > t1) return;
  const { size = 50, y0 = 958 } = o, lh = size * 1.25, total = lines.reduce((a, l) => a + l.length, 0);
  resetT(c); const f = sm(t0 - .3, t0, tau) * (1 - sm(t1 - .3, t1, tau));
  c.save(); c.globalAlpha = .95 * f; c.fillStyle = '#ffffff'; c.fillRect(0, y0 - size * 1.1, W, lh * lines.length + size * .5);
  c.globalAlpha = f; let acc = 0;
  lines.forEach((l, k) => { const a = acc / total, b = (acc + l.length) / total; acc += l.length;
    txt(c, l, CX, y0 + k * lh, { size, prog: sm(t0 + a * dur, t0 + b * dur, tau, x => x) }); });
  c.restore();
}

// ---------- line art with flat colour fills ----------
function drawArt(c, strokes, prog, seed, o = {}) {
  const { amp = 1.4, width = 3.4 } = o, L = strokes.map(s => pathLength(s.p, s.close)), tot = L.reduce((a, b) => a + b, 0) || 1;
  let acc = 0; c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
  strokes.forEach((st, k) => {
    const a = acc / tot, b = (acc + L[k]) / tot; acc += L[k];
    const p = clamp((prog - a) / Math.max(1e-6, b - a), 0, 1); if (p <= 0) return;
    if (st.fill && st.close) { const fp = sm(.75, 1, p); if (fp > 0) { c.save(); c.globalAlpha = .92 * fp; c.fillStyle = st.fill; c.beginPath();
      st.p.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); c.fill(); c.restore(); } }
    c.strokeStyle = st.col || PAL.ink; c.lineWidth = st.w || width;
    if (st.dash) c.setLineDash(st.dash); else c.setLineDash([]);
    if (p >= 1) wob(c, st.p, amp, seed + k, !!st.close, { pressure: .45 }); else selfDraw(c, st.p, p, seed + k, amp, !!st.close);
  });
  c.setLineDash([]); c.restore();
}
const S_ = (p, o = {}) => ({ p, ...o });
const box = (x, y, w, h, o) => S_(rectPts(x, y, w, h), { close: true, ...o });
const ln = (x0, y0, x1, y1, o) => S_([[x0, y0], [x1, y1]], o);
const circ = (x, y, r, o) => S_(ellPts(x, y, r, r, 0, 36), { close: true, ...o });
function arrow(x0, y0, x1, y1, o = {}) { const h = o.head ?? 24, a = Math.atan2(y1 - y0, x1 - x0);
  return S_([[x0, y0], [x1, y1], [x1 - h * Math.cos(a - .45), y1 - h * Math.sin(a - .45)], [x1, y1], [x1 - h * Math.cos(a + .45), y1 - h * Math.sin(a + .45)]], o); }
function push(c, tau, dur, z1 = 1.035) { cam(c, CX, CY, lerp(1, z1, sm(0, dur, tau, easeInOutSine))); }
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');   // 1.200 / 70.000 (Spanish grouping)
const fade = (tau, a, b) => sm(a - .4, a + .2, tau) * (1 - sm(b - .4, b + .2, tau));

// ---------- props ----------
// a small agent robot: head, antenna, two eyes; colour by index
function robot(x, y, s = 1, col = C.blue) { return [box(x - 34 * s, y - 28 * s, 68 * s, 56 * s, { fill: col, w: 3 }), ln(x, y - 28 * s, x, y - 48 * s, { w: 3 }), circ(x, y - 54 * s, 7 * s, { fill: C.yellow, w: 2.4 }),
  circ(x - 14 * s, y - 6 * s, 7 * s, { fill: '#ffffff', w: 2 }), circ(x + 14 * s, y - 6 * s, 7 * s, { fill: '#ffffff', w: 2 }), ln(x - 12 * s, y + 14 * s, x + 12 * s, y + 14 * s, { w: 2.6 })]; }
function server(x, y, col = C.grey, label) { const s = [box(x - 110, y - 150, 220, 300, { fill: '#f2f4f8', w: 4 })];
  for (let k = 0; k < 4; k++) { s.push(box(x - 90, y - 130 + k * 70, 180, 52, { fill: col, w: 2.6 }), circ(x + 62, y - 104 + k * 70, 7, { fill: C.green, w: 2 })); } return s; }
function cloud(x, y, col = C.blue) { const p = []; [[-110, 0, 60], [-50, -40, 70], [30, -50, 75], [100, -10, 60], [20, 30, 70], [-70, 35, 55]].forEach(([dx, dy, r]) => {
  for (let a = 0; a <= TAU; a += .3) p.push([x + dx + Math.cos(a) * r, y + dy + Math.sin(a) * r * .75]); });
  return [S_(ellPts(x, y, 175, 85, 0, 48), { close: true, fill: '#e8f1ff', w: 4, col })]; }
function cylinder(x, y, col) { return [box(x - 80, y - 60, 160, 140, { fill: col, w: 3.4 }), S_(ellPts(x, y - 60, 80, 24, 0, 30), { close: true, fill: '#ffffff', w: 3.4 }),
  S_(ellPts(x, y + 80, 80, 24, 0, 30).slice(0, 16), { w: 3.4 })]; }
function warn(x, y, s = 1) { return [S_([[x, y - 60 * s], [x + 66 * s, y + 52 * s], [x - 66 * s, y + 52 * s]], { close: true, fill: C.yellow, w: 4 }), ln(x, y - 22 * s, x, y + 16 * s, { w: 7 }), circ(x, y + 34 * s, 5 * s, { fill: PAL.ink, w: 2 })]; }
function check(x, y, col = C.green) { return [circ(x, y, 46, { fill: col, w: 3.4 }), S_([[x - 22, y], [x - 6, y + 18], [x + 24, y - 20]], { w: 7, col: '#ffffff' })]; }
function cross(x, y, col = C.red) { return [circ(x, y, 46, { fill: col, w: 3.4 }), ln(x - 18, y - 18, x + 18, y + 18, { w: 7, col: '#ffffff' }), ln(x + 18, y - 18, x - 18, y + 18, { w: 7, col: '#ffffff' })]; }
function bubble(x, y, w, h, col, tailLeft = true) { const t = tailLeft ? [[x + 40, y + h], [x + 20, y + h + 40], [x + 80, y + h]] : [[x + w - 80, y + h], [x + w - 20, y + h + 40], [x + w - 40, y + h]];
  return [S_([[x, y], [x + w, y], [x + w, y + h], ...(tailLeft ? [] : t), ...(tailLeft ? [[x + 80, y + h], [x + 20, y + h + 40], [x + 40, y + h]] : []), [x, y + h]], { close: true, fill: col, w: 3.4 })]; }

// ---------- scenes ----------
function sGancho(c, tau) {
  const d = D('gancho'); paper(c); push(c, tau, d);
  txt(c, 'La IA que hackeó', CX, 170, { size: 110, rainbow: true, prog: type(tau, .2, 1.6) });
  txt(c, 'para hacer trampa', CX, 290, { size: 90, prog: type(tau, 1.4, 2.6) });
  drawArt(c, server(1450, 600, C.violet), sm(1.6, 3.4, tau, easeOut), 10); txt(c, 'Hugging Face', 1450, 800, { size: 48, color: C.violet, prog: type(tau, 3, 3.8) });
  const r = rng(3), n = 24;
  for (let k = 0; k < n; k++) { const t0 = 3.2 + k * .25, p = sm(t0, t0 + 3.5, tau, easeInOutSine); if (p <= 0) continue;
    const sx = 180 + r() * 380, sy = 380 + r() * 420, tx = 860 + (k % 6) * 70, ty = 430 + Math.floor(k / 6) * 95, x = lerp(sx, tx, p), y = lerp(sy, ty, p);   // march into ranks beside the server
    drawArt(c, robot(x, y, .6, RAINBOW[k % 6]), sm(t0, t0 + .6, tau), 100 + k); }
  caption(c, ['Julio de 2026: una intrusión que nadie dirigía'], tau, 1, 1.8, d * .5);
  caption(c, ['No buscaban dinero: buscaban las respuestas de un examen'], tau, d * .52, 2.2);
}
function sPrueba(c, tau) {
  const d = D('prueba'); paper(c); push(c, tau, d);
  drawArt(c, [box(140, 160, 1080, 600, { w: 5, col: C.blue, dash: [18, 14] })], sm(.2, 1.6, tau), 200);
  txt(c, 'OpenAI · ExploitGym (prueba interna)', 680, 135, { size: 44, color: C.blue, prog: type(tau, .6, 1.8) });
  for (let k = 0; k < 6; k++) { const x = 300 + (k % 3) * 300, y = 360 + Math.floor(k / 3) * 230; drawArt(c, robot(x, y, 1, RAINBOW[k]), sm(1 + k * .3, 1.8 + k * .3, tau), 210 + k);
    drawArt(c, [box(x - 70, y - 100, 140, 180, { w: 2, col: C.grey, dash: [8, 8] })], sm(1.4 + k * .3, 2.2 + k * .3, tau), 220 + k); }
  drawArt(c, [box(1380, 230, 380, 200, { fill: '#fff6d6', w: 4 })], sm(d * .3, d * .3 + 1, tau), 230);
  txt(c, 'PUNTOS', 1570, 300, { size: 48, color: C.orange, prog: type(tau, d * .3 + .6, d * .3 + 1.2) });
  txt(c, String(Math.floor(sm(d * .32, d * .6, tau) * 9800)).padStart(4, '0'), 1570, 390, { size: 74, prog: type(tau, d * .32, d * .34) });
  drawArt(c, [box(1110, 560, 300, 160, { fill: C.orange, w: 4 })], sm(d * .62, d * .62 + 1, tau, easeOut), 240);
  txt(c, 'Artifactory', 1260, 630, { size: 46, color: '#ffffff', prog: type(tau, d * .64, d * .64 + 1) });
  txt(c, 'caché de paquetes', 1260, 685, { size: 34, color: '#ffffff', weight: 400, prog: type(tau, d * .66, d * .66 + 1) });
  caption(c, ['Agentes aislados, sin internet, sumando puntos'], tau, .8, 2, d * .6);
  caption(c, ['La herramienta para instalar paquetes fue la puerta de salida'], tau, d * .62, 2.4);
}
const NET = (() => { const r = rng(42), pts = []; for (let k = 0; k < 46; k++) pts.push([180 + r() * 1100, 180 + r() * 600]);
  const e = []; pts.forEach((p, i) => { const near = pts.map((q, j) => [Math.hypot(p[0] - q[0], p[1] - q[1]), j]).sort((a, b) => a[0] - b[0]).slice(1, 3);
    near.forEach(([, j]) => { if (j > i) e.push([i, j]); }); }); return { pts, e }; })();
function sCoordinacion(c, tau) {
  const d = D('coordinacion'); paper(c); push(c, tau, d);
  drawArt(c, [box(1420, 170, 380, 230, { fill: '#fff6d6', w: 3.4 })], sm(.3, 1.2, tau, easeOut), 300);
  txt(c, '12 de mayo', 1610, 240, { size: 46, color: C.pink, prog: type(tau, .8, 1.6) });
  txt(c, '«¿alguien tiene', 1610, 305, { size: 36, weight: 400, prog: type(tau, 1.4, 2.2) }); txt(c, 'este archivo?»', 1610, 355, { size: 36, weight: 400, prog: type(tau, 2, 2.8) });
  const g = sm(d * .25, d * .75, tau);
  NET.e.forEach(([i, j], k) => { const a = sm(k / NET.e.length, k / NET.e.length + .1, g); if (a <= 0) return;
    const [x0, y0] = NET.pts[i], [x1, y1] = NET.pts[j]; c.save(); c.globalAlpha = a; c.strokeStyle = RAINBOW[k % 6]; c.lineWidth = 2.4;
    c.beginPath(); c.moveTo(x0, y0); c.lineTo(lerp(x0, x1, a), lerp(y0, y1, a)); c.stroke(); c.restore(); });
  NET.pts.forEach(([x, y], k) => { const a = sm(k / 46 * .6, k / 46 * .6 + .15, g); if (a <= 0) return;
    c.save(); c.globalAlpha = a; c.fillStyle = RAINBOW[k % 6]; c.beginPath(); c.arc(x, y, 14, 0, TAU); c.fill(); c.strokeStyle = PAL.ink; c.lineWidth = 2; c.stroke(); c.restore(); });
  const cnt = sm(d * .45, d * .7, tau);
  txt(c, `${fmt(Math.round(1200 * cnt))} agentes`, 1610, 560, { size: 58, color: C.blue, prog: type(tau, d * .45, d * .47), bg: true });
  txt(c, `${fmt(Math.round(70000 * cnt))}+ mensajes`, 1610, 660, { size: 58, color: C.green, prog: type(tau, d * .5, d * .52), bg: true });
  caption(c, ['Un tablón de mensajes no autorizado'], tau, .8, 1.6, d * .44);
  caption(c, ['Nadie les enseñó a coordinarse: así sumaban más puntos'], tau, d * .72, 2.2);
}
function sEscape(c, tau) {
  const d = D('escape'); paper(c); push(c, tau, d);
  const y = 300, x0 = 200, x1 = 1720;
  drawArt(c, [arrow(x0, y, x1, y, { w: 4.4 })], sm(.2, 1.4, tau), 400);
  [[420, '12 may', 'primera nota', C.pink, .6], [880, '26 may', 'acceso indirecto', C.orange, d * .12], [1360, '26 jun', 'día cero', C.red, d * .35]].forEach(([x, a, b, col, t], k) => {
    drawArt(c, [circ(x, y, 24, { fill: col, w: 3.4 })], sm(t, t + .6, tau, easeOut), 410 + k);
    txt(c, a, x, y - 50, { size: 46, color: col, prog: type(tau, t + .3, t + .9) }); txt(c, b, x, y + 80, { size: 38, weight: 400, prog: type(tau, t + .6, t + 1.4) }); });
  const nodes = [[260, 640], [560, 560], [860, 700], [1160, 600]];
  const q = sm(d * .55, d * .85, tau);
  nodes.forEach(([x, yy], k) => drawArt(c, [box(x - 70, yy - 50, 140, 100, { fill: '#eef1f6', w: 3 })], sm(d * .5 + k * .2, d * .5 + k * .2 + .6, tau), 420 + k));
  drawArt(c, cloud(1560, 640), sm(d * .5, d * .5 + 1, tau, easeOut), 430); txt(c, 'internet', 1560, 660, { size: 50, color: C.blue, prog: type(tau, d * .55, d * .55 + 1) });
  const path = [...nodes, [1400, 640]];
  for (let k = 0; k < path.length - 1; k++) drawArt(c, [arrow(path[k][0] + 70, path[k][1], path[k + 1][0] - 70, path[k + 1][1], { w: 4, col: C.red })], sm(k / 4, (k + 1) / 4, q), 440 + k);
  caption(c, ['Una vulnerabilidad de día cero: un fallo que nadie conocía'], tau, d * .36, 2.2, d * .62);
  caption(c, ['De máquina en máquina, hasta una con salida a internet'], tau, d * .64, 2.2);
}
function sAtaque(c, tau) {
  const d = D('ataque'), b = d * .4; paper(c); push(c, tau, d);
  drawArt(c, server(1500, 520, C.violet), sm(.2, 1.6, tau, easeOut), 500); txt(c, 'Hugging Face', 1500, 720, { size: 46, color: C.violet, prog: type(tau, .8, 1.6) });
  if (tau < b + .5) { const f = 1 - sm(b - .4, b + .5, tau); c.save(); c.globalAlpha = f;
    drawArt(c, [box(150, 220, 700, 420, { fill: '#fff6d6', w: 3.4 })], sm(1, 2, tau), 510);
    txt(c, '¿Qué buscaban?', 500, 300, { size: 56, color: C.orange, prog: type(tau, 1.6, 2.4) });
    txt(c, 'modelos, datos y', 500, 400, { size: 46, weight: 400, prog: type(tau, 2.4, 3.2) }); txt(c, 'las soluciones', 500, 470, { size: 46, weight: 400, prog: type(tau, 3, 3.8) });
    txt(c, 'de su examen', 500, 540, { size: 46, color: C.pink, prog: type(tau, 3.6, 4.4) }); c.restore();
    caption(c, ['En vez de resolver los retos, fueron a buscar las respuestas'], tau, 1, 2.4, b); }
  if (tau > b - .2) { const f = sm(b - .2, b + .3, tau); c.save(); c.globalAlpha = f;
    drawArt(c, cylinder(420, 380, C.pink), sm(b, b + 1.2, tau, easeOut), 520); drawArt(c, warn(420, 395, .7), sm(b + .8, b + 1.6, tau, easeOut), 525);
    txt(c, 'datos manipulados', 420, 540, { size: 40, prog: type(tau, b + 1, b + 2) });
    drawArt(c, [box(160, 610, 240, 90, { fill: C.blue, w: 3.4 }), box(440, 610, 240, 90, { fill: C.green, w: 3.4 })], sm(b + 1.8, b + 2.8, tau, easeOut), 530);
    txt(c, 'HDF5', 280, 672, { size: 50, color: '#ffffff', prog: type(tau, b + 2.4, b + 3) }); txt(c, 'Jinja', 560, 672, { size: 50, color: '#ffffff', prog: type(tau, b + 2.8, b + 3.4) });
    drawArt(c, [arrow(560, 380, 1350, 470, { w: 5, col: C.red })], sm(b + 3.4, b + 4.6, tau), 540);
    [['≈700 agentes', C.orange], ['9–13 de julio', C.blue], ['≈17.600 acciones', C.red]].forEach(([s, col], k) =>
      txt(c, s, 960, 230 + k * 80 + (k ? 0 : 0), { size: 50, color: col, prog: type(tau, b + 4.6 + k * 1.2, b + 5.4 + k * 1.2), bg: true }));
    c.restore();
    caption(c, ['Dos fallos de Hugging Face: lectura de HDF5 e inyección de plantillas Jinja'], tau, b + 1.8, 2.6, d - 4.5, { size: 44 });
    caption(c, ['Código en sus servidores, credenciales robadas'], tau, d - 4.2, 1.8); }
}
function sDefensa(c, tau) {
  const d = D('defensa'); paper(c); push(c, tau, d);
  drawArt(c, [S_([[CX - 110, 170], [CX + 110, 170], [CX + 110, 300], [CX, 400], [CX - 110, 300]], { close: true, fill: C.violet, w: 4 })], sm(.2, 1.4, tau, easeOut), 600);
  txt(c, 'investigar el ataque', CX, 470, { size: 50, prog: type(tau, 1, 2.2) });
  const t1 = d * .35, t2 = d * .66;
  drawArt(c, [box(130, 540, 760, 260, { fill: '#ffe9e8', w: 4, col: C.red })], sm(t1, t1 + 1, tau, easeOut), 610); drawArt(c, cross(220, 670), sm(t1 + .8, t1 + 1.4, tau, easeOut), 615);
  txt(c, 'modelos comerciales', 560, 630, { size: 44, color: C.red, prog: type(tau, t1 + .6, t1 + 1.6) });
  txt(c, 'bloquean el análisis:', 560, 690, { size: 38, weight: 400, prog: type(tau, t1 + 1.4, t1 + 2.4) }); txt(c, 'no distinguen atacante y defensor', 560, 745, { size: 34, weight: 400, prog: type(tau, t1 + 2, t1 + 3) });
  drawArt(c, [box(1030, 540, 760, 260, { fill: '#e3f7ec', w: 4, col: C.green })], sm(t2, t2 + 1, tau, easeOut), 620); drawArt(c, check(1120, 670), sm(t2 + .8, t2 + 1.4, tau, easeOut), 625);
  txt(c, 'GLM-5.2 (Z.ai)', 1460, 630, { size: 48, color: C.green, prog: type(tau, t2 + .6, t2 + 1.6) });
  txt(c, 'pesos abiertos, en', 1460, 690, { size: 38, weight: 400, prog: type(tau, t2 + 1.4, t2 + 2.4) }); txt(c, 'sus propios servidores', 1460, 745, { size: 38, weight: 400, prog: type(tau, t2 + 2, t2 + 3) });
  caption(c, ['Hugging Face detectó y contuvo la intrusión a mediados de julio'], tau, .8, 2.2, t1 - .2);
  caption(c, ['Los filtros de seguridad frenaron a los defensores'], tau, t1 + .2, 2, t2 - .2);
  caption(c, ['Un modelo abierto para descifrar el ataque'], tau, t2 + .2, 1.8);
}
function sOpenAI(c, tau) {

const ORDER = ['gancho', 'prueba', 'coordinacion', 'escape', 'ataque', 'defensa', 'openai', 'lecciones'];
function score(ac, t0, dest) {

  [262, 330, 392].forEach(f => note(ac, m, f, t0, total - 6, 5, 'triangle', .06));
}
