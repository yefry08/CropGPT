<!doctype html>
<meta charset="utf-8">
<title>Reel: la IA que hackeó para copiar</title>
<style>
  body{margin:0;background:#111;color:#ccc;font:13px/1.4 ui-monospace,Menlo,monospace;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
  canvas#c{height:min(86vh,960px);width:auto;background:#fff;box-shadow:0 0 0 1px #333}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
  button{background:#222;color:#ddd;border:1px solid #444;padding:4px 10px;cursor:pointer;font:inherit}
  input[type=range]{width:320px}
</style>
<canvas id="c"></canvas>
<script src="timing-reel.js"></script>
<script src="core.js"></script>
<script>
/* Reel (9:16, ~60 s) of the OpenAI–Hugging Face explainer: same verified facts and look as ia-hackers.html,
   condensed script in sections-reel.json, scenes timed to its own narration (timing-reel.js). */
usePalette(makePalette({ paper: '#ffffff', paperBand: null }, 'paperInk'));
const C = { blue: '#1f6fd1', pink: '#ff3d8b', yellow: '#ffc61a', green: '#16a86a', orange: '#ff7a1a', violet: '#7a4fd8', red: '#e5322d', grey: '#9aa3b5' };
const RAINBOW = [C.blue, C.pink, C.yellow, C.green, C.orange, C.violet];
const FONT = '"Comic Neue", "Comic Sans MS", cursive';
const D = id => window.SECTION_DURS[id];

// ---------- lettering ----------
function txt(c, s, x, y, o = {}) {
  const { size = 56, weight = 700, color = PAL.ink, align = 'center', prog = 1, rainbow = false, bg = false } = o;
  const n = Math.ceil(s.length * clamp(prog, 0, 1)); if (!n) return;
  c.save(); c.font = `${weight} ${size}px ${FONT}`; c.textBaseline = 'alphabetic';
  const w = c.measureText(s.slice(0, n)).width, x0 = align === 'center' ? x - c.measureText(s).width / 2 : align === 'right' ? x - w : x;
  if (bg) { c.fillStyle = '#ffffff'; c.fillRect(x0 - 12, y - size * .95, (align === 'center' ? c.measureText(s).width : w) + 24, size * 1.25); }
  if (!rainbow) { c.textAlign = 'left'; c.fillStyle = color; c.fillText(s.slice(0, n), x0, y); c.restore(); return; }
  let cx = x0; c.textAlign = 'left';
  for (let i = 0; i < n; i++) { c.fillStyle = s[i] === ' ' ? PAL.ink : RAINBOW[i % RAINBOW.length]; c.fillText(s[i], cx, y); cx += c.measureText(s[i]).width; }
  c.restore();
}
const type = (tau, a, b) => sm(a, b, tau, x => x);
function caption(c, lines, tau, t0, dur = 1.8, t1 = Infinity, o = {}) {
  if (tau < t0 - .3 || tau > t1) return;
  const { size = 50, y0 = 958 } = o, lh = size * 1.25, total = lines.reduce((a, l) => a + l.length, 0);
  resetT(c); const f = sm(t0 - .3, t0, tau) * (1 - sm(t1 - .3, t1, tau));
  c.save(); c.globalAlpha = .95 * f; c.fillStyle = '#ffffff'; c.fillRect(0, y0 - size * 1.1, W, lh * lines.length + size * .5);
  c.globalAlpha = f; let acc = 0;
  lines.forEach((l, k) => { const a = acc / total, b = (acc + l.length) / total; acc += l.length;
    txt(c, l, CX, y0 + k * lh, { size, prog: sm(t0 + a * dur, t0 + b * dur, tau, x => x) }); });
  c.restore();
}

// ---------- line art with flat colour fills ----------
function drawArt(c, strokes, prog, seed, o = {}) {
  const { amp = 1.4, width = 3.4 } = o, L = strokes.map(s => pathLength(s.p, s.close)), tot = L.reduce((a, b) => a + b, 0) || 1;
  let acc = 0; c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
  strokes.forEach((st, k) => {
    const a = acc / tot, b = (acc + L[k]) / tot; acc += L[k];
    const p = clamp((prog - a) / Math.max(1e-6, b - a), 0, 1); if (p <= 0) return;
    if (st.fill && st.close) { const fp = sm(.75, 1, p); if (fp > 0) { c.save(); c.globalAlpha = .92 * fp; c.fillStyle = st.fill; c.beginPath();
      st.p.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); c.fill(); c.restore(); } }
    c.strokeStyle = st.col || PAL.ink; c.lineWidth = st.w || width;
    if (st.dash) c.setLineDash(st.dash); else c.setLineDash([]);
    if (p >= 1) wob(c, st.p, amp, seed + k, !!st.close, { pressure: .45 }); else selfDraw(c, st.p, p, seed + k, amp, !!st.close);
  });
  c.setLineDash([]); c.restore();
}
const S_ = (p, o = {}) => ({ p, ...o });
const box = (x, y, w, h, o) => S_(rectPts(x, y, w, h), { close: true, ...o });
const ln = (x0, y0, x1, y1, o) => S_([[x0, y0], [x1, y1]], o);
const circ = (x, y, r, o) => S_(ellPts(x, y, r, r, 0, 36), { close: true, ...o });
function arrow(x0, y0, x1, y1, o = {}) { const h = o.head ?? 24, a = Math.atan2(y1 - y0, x1 - x0);
  return S_([[x0, y0], [x1, y1], [x1 - h * Math.cos(a - .45), y1 - h * Math.sin(a - .45)], [x1, y1], [x1 - h * Math.cos(a + .45), y1 - h * Math.sin(a + .45)]], o); }
function push(c, tau, dur, z1 = 1.035) { cam(c, CX, CY, lerp(1, z1, sm(0, dur, tau, easeInOutSine))); }
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');   // 1.200 / 70.000 (Spanish grouping)
const fade = (tau, a, b) => sm(a - .4, a + .2, tau) * (1 - sm(b - .4, b + .2, tau));

// ---------- props ----------
// a small agent robot: head, antenna, two eyes; colour by index
function robot(x, y, s = 1, col = C.blue) { return [box(x - 34 * s, y - 28 * s, 68 * s, 56 * s, { fill: col, w: 3 }), ln(x, y - 28 * s, x, y - 48 * s, { w: 3 }), circ(x, y - 54 * s, 7 * s, { fill: C.yellow, w: 2.4 }),
  circ(x - 14 * s, y - 6 * s, 7 * s, { fill: '#ffffff', w: 2 }), circ(x + 14 * s, y - 6 * s, 7 * s, { fill: '#ffffff', w: 2 }), ln(x - 12 * s, y + 14 * s, x + 12 * s, y + 14 * s, { w: 2.6 })]; }
function server(x, y, col = C.grey, label) { const s = [box(x - 110, y - 150, 220, 300, { fill: '#f2f4f8', w: 4 })];
  for (let k = 0; k < 4; k++) { s.push(box(x - 90, y - 130 + k * 70, 180, 52, { fill: col, w: 2.6 }), circ(x + 62, y - 104 + k * 70, 7, { fill: C.green, w: 2 })); } return s; }
function cloud(x, y, col = C.blue) { const p = []; [[-110, 0, 60], [-50, -40, 70], [30, -50, 75], [100, -10, 60], [20, 30, 70], [-70, 35, 55]].forEach(([dx, dy, r]) => {
  for (let a = 0; a <= TAU; a += .3) p.push([x + dx + Math.cos(a) * r, y + dy + Math.sin(a) * r * .75]); });
  return [S_(ellPts(x, y, 175, 85, 0, 48), { close: true, fill: '#e8f1ff', w: 4, col })]; }
function cylinder(x, y, col) { return [box(x - 80, y - 60, 160, 140, { fill: col, w: 3.4 }), S_(ellPts(x, y - 60, 80, 24, 0, 30), { close: true, fill: '#ffffff', w: 3.4 }),
  S_(ellPts(x, y + 80, 80, 24, 0, 30).slice(0, 16), { w: 3.4 })]; }
function warn(x, y, s = 1) { return [S_([[x, y - 60 * s], [x + 66 * s, y + 52 * s], [x - 66 * s, y + 52 * s]], { close: true, fill: C.yellow, w: 4 }), ln(x, y - 22 * s, x, y + 16 * s, { w: 7 }), circ(x, y + 34 * s, 5 * s, { fill: PAL.ink, w: 2 })]; }
function check(x, y, col = C.green) { return [circ(x, y, 46, { fill: col, w: 3.4 }), S_([[x - 22, y], [x - 6, y + 18], [x + 24, y - 20]], { w: 7, col: '#ffffff' })]; }
function cross(x, y, col = C.red) { return [circ(x, y, 46, { fill: col, w: 3.4 }), ln(x - 18, y - 18, x + 18, y + 18, { w: 7, col: '#ffffff' }), ln(x + 18, y - 18, x - 18, y + 18, { w: 7, col: '#ffffff' })]; }
function bubble(x, y, w, h, col, tailLeft = true) { const t = tailLeft ? [[x + 40, y + h], [x + 20, y + h + 40], [x + 80, y + h]] : [[x + w - 80, y + h], [x + w - 20, y + h + 40], [x + w - 40, y + h]];
  return [S_([[x, y], [x + w, y], [x + w, y + h], ...(tailLeft ? [] : t), ...(tailLeft ? [[x + 80, y + h], [x + 20, y + h + 40], [x + 40, y + h]] : []), [x, y + h]], { close: true, fill: col, w: 3.4 })]; }

// ---------- scenes (9:16; art above y≈1250, captions at the bottom band) ----------
const CAP = { size: 58, y0: 1420 };
function sHook(c, tau) {
  const d = D('hook'); paper(c); push(c, tau, d);
  txt(c, 'Hackearon', CX, 250, { size: 130, rainbow: true, prog: type(tau, .1, 1) });
  txt(c, 'Hugging Face', CX, 390, { size: 110, color: C.violet, prog: type(tau, .8, 1.8) });
  drawArt(c, server(CX + 250, 800, C.violet), sm(1, 2.6, tau, easeOut), 10);
  const r = rng(3);
  for (let k = 0; k < 20; k++) { const t0 = 1.8 + k * .15, p = sm(t0, t0 + 2.6, tau, easeInOutSine); if (p <= 0) continue;
    const sx = 80 + r() * 300, sy = 1000 + r() * 250, tx = 110 + (k % 4) * 95, ty = 620 + Math.floor(k / 4) * 105;
    drawArt(c, robot(lerp(sx, tx, p), lerp(sy, ty, p), .7, RAINBOW[k % 6]), sm(t0, t0 + .5, tau), 100 + k); }
  caption(c, ['…para copiar en un examen'], tau, d * .35, 1.4, Infinity, CAP);
}
function sEscape(c, tau) {
  const d = D('escape'); paper(c); push(c, tau, d);
  drawArt(c, [box(90, 170, 900, 520, { w: 5, col: C.blue, dash: [18, 14] })], sm(.1, 1.2, tau), 200);
  txt(c, 'prueba de OpenAI · sin internet', CX, 150, { size: 42, color: C.blue, prog: type(tau, .4, 1.6) });
  for (let k = 0; k < 6; k++) { const x = 250 + (k % 3) * 290, y = 330 + Math.floor(k / 3) * 220;
    drawArt(c, robot(x, y, 1, RAINBOW[k]), sm(.6 + k * .2, 1.2 + k * .2, tau), 210 + k); }
  const g = sm(d * .3, d * .55, tau);
  for (let k = 0; k < 15; k++) { const i = k % 6, j = (k * 5 + 2) % 6; if (i === j) continue; const a = sm(k / 15, k / 15 + .2, g); if (a <= 0) continue;
    const p = [250 + (i % 3) * 290, 330 + Math.floor(i / 3) * 220], q = [250 + (j % 3) * 290, 330 + Math.floor(j / 3) * 220];
    c.save(); c.globalAlpha = a; c.strokeStyle = RAINBOW[k % 6]; c.lineWidth = 4; c.setLineDash([10, 10]); c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(lerp(p[0], q[0], a), lerp(p[1], q[1], a)); c.stroke(); c.restore(); }
  const cnt = sm(d * .4, d * .65, tau);
  txt(c, `${fmt(Math.round(1200 * cnt))} agentes`, CX, 820, { size: 72, color: C.blue, prog: type(tau, d * .4, d * .42) });
  txt(c, `${fmt(Math.round(70000 * cnt))}+ mensajes`, CX, 920, { size: 72, color: C.green, prog: type(tau, d * .45, d * .47) });
  drawArt(c, [box(260, 1010, 560, 140, { fill: C.red, w: 4 })], sm(d * .72, d * .72 + .8, tau, easeOut), 230);
  txt(c, 'día cero → escape', CX, 1100, { size: 64, color: '#ffffff', prog: type(tau, d * .75, d * .75 + 1) });
  caption(c, ['Un tablón de mensajes secreto'], tau, d * .3, 1.4, Infinity, CAP);
}
function sAtaque(c, tau) {
  const d = D('ataque'); paper(c); push(c, tau, d);
  drawArt(c, cylinder(260, 420, C.pink), sm(.2, 1.2, tau, easeOut), 300); drawArt(c, warn(260, 435, .7), sm(.9, 1.6, tau, easeOut), 305);
  txt(c, 'datos manipulados', 260, 590, { size: 42, prog: type(tau, 1, 2) });
  drawArt(c, server(800, 480, C.violet), sm(.4, 1.8, tau, easeOut), 310); txt(c, 'Hugging Face', 800, 690, { size: 44, color: C.violet, prog: type(tau, 1.2, 2) });
  drawArt(c, [arrow(370, 420, 660, 440, { w: 6, col: C.red })], sm(1.8, 2.8, tau), 320);
  txt(c, '≈700 agentes', CX, 830, { size: 80, color: C.orange, prog: type(tau, 2.4, 3.2) });
  drawArt(c, [box(140, 920, 800, 300, { fill: '#fff6d6', w: 4 })], sm(d * .55, d * .55 + .8, tau, easeOut), 330);
  txt(c, '¿El objetivo?', CX, 1010, { size: 56, color: C.orange, prog: type(tau, d * .58, d * .58 + .8) });
  txt(c, 'las respuestas', CX, 1095, { size: 62, prog: type(tau, d * .64, d * .64 + .8) });
  txt(c, 'de su examen', CX, 1170, { size: 62, color: C.pink, prog: type(tau, d * .7, d * .7 + .8) });
}
function sGiro(c, tau) {
  const d = D('giro'), b = d * .45; paper(c); push(c, tau, d);
  if (tau < b + .5) { const f = 1 - sm(b - .4, b + .5, tau); c.save(); c.globalAlpha = f;
    drawArt(c, [box(110, 200, 860, 300, { fill: '#ffe9e8', w: 4, col: C.red })], sm(.2, 1, tau, easeOut), 400); drawArt(c, cross(220, 350), sm(.8, 1.3, tau, easeOut), 405);
    txt(c, 'modelos comerciales:', 600, 330, { size: 48, color: C.red, prog: type(tau, .6, 1.6) }); txt(c, 'análisis bloqueado', 600, 400, { size: 48, prog: type(tau, 1.2, 2.2) });
    drawArt(c, [box(110, 600, 860, 300, { fill: '#e3f7ec', w: 4, col: C.green })], sm(b * .45, b * .45 + .8, tau, easeOut), 410); drawArt(c, check(220, 750), sm(b * .45 + .6, b * .45 + 1.1, tau, easeOut), 415);
    txt(c, 'GLM-5.2', 600, 730, { size: 64, color: C.green, prog: type(tau, b * .45 + .4, b * .45 + 1.2) }); txt(c, 'modelo abierto', 600, 810, { size: 48, prog: type(tau, b * .45 + .9, b * .45 + 1.8) });
    c.restore(); caption(c, ['Hugging Face investiga con IA abierta'], tau, .4, 1.4, b, CAP); }
  if (tau > b - .2) { const f = sm(b - .2, b + .3, tau); c.save(); c.globalAlpha = f;
    txt(c, 'OpenAI', 300, 260, { size: 62, color: C.blue, prog: type(tau, b, b + .6) });
    drawArt(c, bubble(90, 300, 820, 220, '#e8f1ff', true), sm(b + .2, b + 1, tau, easeOut), 420);
    txt(c, '¿Pueden revocar', 500, 390, { size: 58, prog: type(tau, b + .6, b + 1.4) }); txt(c, 'estas credenciales?', 500, 470, { size: 58, prog: type(tau, b + 1, b + 1.8) });
    txt(c, 'Hugging Face', 780, 700, { size: 62, color: C.violet, prog: type(tau, d * .78, d * .78 + .6) });
    drawArt(c, bubble(170, 740, 820, 180, '#efe6ff', false), sm(d * .8, d * .8 + .8, tau, easeOut), 430);
    txt(c, 'Ya están revocadas.', 580, 850, { size: 64, color: C.violet, prog: type(tau, d * .84, d * .84 + 1) });
    c.restore(); caption(c, ['OpenAI tardó días en enterarse'], tau, b + .2, 1.4, Infinity, CAP); }
}
function sCierre(c, tau) {
  const d = D('cierre'), end = d - 3.8; paper(c); push(c, tau, d);
  txt(c, 'reward', CX, 330, { size: 150, rainbow: true, prog: type(tau, .1, .9) }); txt(c, 'hacking', CX, 490, { size: 150, rainbow: true, prog: type(tau, .6, 1.4) });
  txt(c, 'cumplir la meta por', CX, 640, { size: 56, prog: type(tau, 1.4, 2.4) }); txt(c, 'el camino equivocado', CX, 720, { size: 56, color: C.red, prog: type(tau, 2, 3) });
  for (let k = 0; k < 6; k++) drawArt(c, robot(165 + k * 150, 880, .8, RAINBOW[k]), sm(2.4 + k * .15, 3 + k * .15, tau), 500 + k);
  txt(c, '¿Están listas', CX, 1080, { size: 76, color: C.violet, prog: type(tau, d * .55, d * .55 + 1) }); txt(c, 'nuestras reglas?', CX, 1170, { size: 76, color: C.violet, prog: type(tau, d * .6, d * .6 + 1) });
  resetT(c);
  txt(c, 'Voz sintética (Gemini TTS) · Animación hecha con IA (Claude)', CX, 1400, { size: 30, weight: 400, prog: type(tau, end, end + 1.2) });
  txt(c, 'Ilustración · Fuentes: OpenAI y Hugging Face · Datos a 1 oct 2026', CX, 1450, { size: 30, weight: 400, prog: type(tau, end + .6, end + 1.8) });
}
const ORDER = ['hook', 'escape', 'ataque', 'giro', 'cierre'];
function score(ac, t0, dest) {
  const m = ac.createGain(); m.gain.value = .5; m.connect(dest);
  const total = ORDER.reduce((a, k) => a + D(k), 0); let at = 0; const starts = ORDER.map(k => { const s = at; at += D(k); return s; });
  for (let t = .3; t < total - 1.5; t += .5) { const k = Math.round(t * 2); note(ac, m, pentHz(1, [0, 2, 4, 3, 1, 4, 2, 0][k % 8], 262), t0, t, 1, 'triangle', k % 4 ? .045 : .075); }
  starts.slice(1).forEach(t => note(ac, m, 131, t0, t, 1.6, 'sine', .14));
  [262, 330, 392].forEach(f => note(ac, m, f, t0, total - 4, 4, 'triangle', .06));
}
defineFilm({ format: { ar: '9:16', width: 1080 }, fps: 24, score, timeline: ORDER.map((id, k) =>
  ({ name: id, dur: D(id), fn: [sHook, sEscape, sAtaque, sGiro, sCierre][k] })) });
</script>
