function sControl(c, tau) {

function drop(x, y, s = 1) { const p = []; for (let a = 0; a <= TAU; a += .2) { const r = 40 * s * (1 - .4 * Math.sin(a)); p.push([x + Math.cos(a) * r * .8, y + Math.sin(a) * r]); }
  return [S_([[x, y - 70 * s], [x + 33 * s, y - 10 * s], ...p.slice(0, 1), [x - 33 * s, y - 10 * s]], { close: true, fill: C.lblue, w: 3, col: C.blue }), circ(x, y + 6 * s, 34 * s, { fill: C.lblue, w: 3, col: C.blue })]; }
function sRecursos(c, tau) {

  if (tau > b) { for (let k = 0; k < 3; k++) drawArt(c, drop(1150 + k * 150, 420), sm(b + k * .3, b + .8 + k * .3, tau, easeOut), 63 + k);

function sComplacencia(c, tau) {

  card(c, 1000, 520, 760, 160, C.lblue, C.blue, sm(d * .48, d * .48 + .8, tau, easeOut), 72); txt(c, 'Petrov dudó de la máquina', 1380, 615, { size: 48, color: C.blue, prog: type(tau, d * .5, d * .5 + 1) });
