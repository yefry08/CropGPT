<!doctype html>
<meta charset="utf-8">
<title>La IA ahorra tiempo · reel</title>
<style>
  body{margin:0;background:#111;color:#ccc;font:13px/1.4 ui-monospace,Menlo,monospace;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
  canvas#c{height:min(92vh,960px);width:auto;background:#fff;box-shadow:0 0 0 1px #333}
</style>
<canvas id="c"></canvas>
<script src="timing-reel.js"></script>
<script src="core.js"></script>
<script src="kit.js"></script>
<script src="flat.js"></script>
<script>
/* BRIEF: AI-safety series reel (9:16, 60 s), flat Kurzgesagt-like illustration. Why AI saves time but productivity barely moves.
   Verified (sources in descripcion.md): Paul David's dynamo analogy (1990) · Solow, NYT Book Review, 12 Jul 1987 ·
   Uber "agentic pods": capital allocation across 150 cities, 15 h → 30 min (CTO's post, Jul 2026) ·
   INSEAD/HBS field experiment, 515 startups, 1.9x revenue. The time-vs-productivity chart is an illustration.
   Characters are generic bean people; real people only as name cards. Art stays above y≈1500. */
setPalette('rainbow');

// each scene slides in from the right and drifts slowly (camera push)
function shot(c, tau, d, fn) { const k = easeOut(clamp(tau / .45, 0, 1)), z = lerp(1.0, 1.05, sm(0, d, tau, easeInOutSine));
  c.save(); cam(c, CX - (1 - k) * 260, CY, z); c.globalAlpha = clamp(tau / .3, 0, 1); fn(); c.restore(); }

function rGancho(c, tau) {
  const d = D('r-gancho'), fr = [.5], b = beatOf(tau, d, fr), t = since(tau, d, fr, b); sky(c, K.deep, K.violet, 2, tau);
  shot(c, tau, d, () => { ground(c, 1380, '#2b2470');
    if (b === 0) { desk(c, CX, 1150, 640); laptop(c, CX + 120, 1150, 1, tau); bean(c, CX - 160, 1010, 1.1, tau, { shirt: K.teal, skin: K.skins[1], look: 1, arm: .5, t: t / .4 });
      clockFace(c, CX, 520, 190, tau, 6, (t - .3) / .5); pill(c, '+ TIEMPO', CX, 790, (t - .9) / .4, K.orange, { size: 56 }); T(c, 'ahorrado con IA', CX, 880, (t - 1.3) / .4, { size: 46 }); }
    if (b === 1) { chartCard(c, 110, 420, 860, 640, t / .4, sm(.3, 2.2, t)); pill(c, 'tiempo ahorrado', 690, 520, (t - 1) / .4, K.orange, { size: 34 }); pill(c, 'productividad', 700, 930, (t - 1.5) / .4, K.pink, { size: 34 });
      T(c, 'ilustración', 860, 1030, t, { size: 26, color: '#b9bde8', weight: 600, sh: false }); T(c, '¿Por qué no se mueve?', CX, 1230, (t - 1.8) / .5, { size: 74 }); }
  });
}
function rDinamo(c, tau) {
  const d = D('r-dinamo'), fr = [.5, .76], b = beatOf(tau, d, fr), t = since(tau, d, fr, b); sky(c, '#3a2350', '#6a2f4a', 5, tau);
  shot(c, tau, d, () => { ground(c, 1420, '#4a2340');
    factory(c, 170, 700, 740, tau, b, b === 0 ? t / .6 : 1);
    if (b === 0) { pill(c, '1900', CX, 360, (t - .2) / .4, K.orange, { size: 80 }); T(c, 'un solo motor mueve toda la fábrica', CX, 1320, (t - 1.2) / .5, { size: 42 }); }
    if (b === 1) { pill(c, 'vapor  →  electricidad', CX, 360, t / .4, K.yellow, { size: 52, color: K.ink }); T(c, 'pero todo igual', CX, 1320, (t - .8) / .5, { size: 56, color: K.pink }); }
    if (b === 2) { pill(c, 'REDISEÑO', CX, 360, t / .4, K.teal, { size: 80 }); T(c, 'un motor por máquina', CX, 1290, (t - .6) / .5, { size: 50 }); T(c, 'décadas después', CX, 1360, (t - 1) / .5, { size: 42, color: K.yellow }); }
  });
}
function rSolow(c, tau) {
  const d = D('r-solow'), fr = [.64], b = beatOf(tau, d, fr), t = since(tau, d, fr, b); sky(c, '#123a4a', '#1d5b5c', 7, tau);
  shot(c, tau, d, () => { ground(c, 1420, '#16484a');
    if (b === 0) { [[230, 1250], [540, 1300], [850, 1250], [380, 1080], [700, 1080]].forEach(([x, y], i) => crt(c, x, y, 1.1, (t - i * .25) / .4, [K.mint, K.sky, K.yellow][i % 3]));
      pill(c, 'ROBERT SOLOW · ECONOMISTA · 1987', CX, 330, t / .4, K.teal, { size: 34 });
      rr(c, 90, 420, 900, 470, 40, K.white); c.save(); c.fillStyle = K.white; c.beginPath(); c.moveTo(480, 880); c.lineTo(540, 960); c.lineTo(600, 880); c.fill(); c.restore();
      [['«La era de la computadora', .3], ['se ve en todas partes…', 1.1], ['menos en las estadísticas', 2.2], ['de productividad»', 2.8]].forEach(([s, a], i) => T(c, s, CX, 520 + i * 95, (t - a) / .4, { size: 52, color: i > 1 ? K.pink : K.ink, sh: false })); }
    if (b === 1) { robo(c, CX, 760, 1.6, tau); T(c, 'Con la IA:', CX, 450, t / .4, { size: 70 }); pill(c, 'la misma pausa', CX, 1060, (t - .6) / .4, K.yellow, { size: 64, color: K.ink }); }
  });
}
function rRedisenar(c, tau) {
  const d = D('r-redisenar'), fr = [.12, .55], b = beatOf(tau, d, fr), t = since(tau, d, fr, b); sky(c, '#1b3a2a', '#1f5a3d', 9, tau);
  shot(c, tau, d, () => { ground(c, 1430, '#174a33');
    if (b === 0) { T(c, 'Rediseñar', CX, 760, t / .4, { size: 120, color: K.mint }); T(c, 'el proceso entero', CX, 880, (t - .3) / .4, { size: 64 }); }
    if (b === 1) { pill(c, 'UBER · ASIGNACIÓN DE CAPITAL', CX, 330, t / .4, K.teal, { size: 38 }); T(c, 'en 150 ciudades', CX, 420, (t - .3) / .4, { size: 44 });
      hourglass(c, 300, 760, 1.4, sm(.4, 2.5, t), tau); T(c, '15 h', 300, 1040, (t - .4) / .4, { size: 90, color: '#c9cdf5' });
      T(c, '→', CX + 30, 760, (t - 1.6) / .4, { size: 110, color: K.yellow }); clockFace(c, 780, 760, 150, tau, 2, (t - 2) / .4); T(c, '30 min', 780, 1040, (t - 2.4) / .4, { size: 100, color: K.mint });
      bean(c, CX, 1290, .8, tau, { shirt: K.orange, skin: K.skins[2], arm: 1, t: (t - 2.8) / .4 }); }
    if (b === 2) { pill(c, 'EXPERIMENTO · INSEAD Y HARVARD', CX, 330, t / .4, K.teal, { size: 36 }); T(c, '515 startups', CX, 430, (t - .3) / .4, { size: 70 });
      const r = rng(4); for (let i = 0; i < 40; i++) { const g = i < 20, col = g ? '#8f93c4' : K.mint, x = (g ? 120 : 600) + (i % 5) * 80, y = 600 + Math.floor((i % 20) / 5) * 90, a = clamp((t - .6 - i * .03) / .3, 0, 1);
        if (a > 0) building(c, x + 20, y + 40, a * (1 + r() * .3), col); }
      T(c, 'casos genéricos', 300, 990, (t - 1.5) / .4, { size: 34, color: '#c9cdf5' }); T(c, 'cómo otras se reorganizaron', 780, 990, (t - 1.8) / .4, { size: 30, color: K.mint });
      rr(c, 160, 1060, 280 * sm(2.2, 3, t), 60, 30, '#8f93c4'); rr(c, 640, 1060 - 60 * sm(2.2, 3, t), 280, 60 + 60 * sm(2.2, 3, t), 30, K.mint);
      pill(c, '1,9× ingresos', 780, 1260, (t - 3.2) / .4, K.yellow, { size: 56, color: K.ink }); }
  });
}
function rCierre(c, tau) {
  const d = D('r-cierre'), fr = [.45], b = beatOf(tau, d, fr), t = since(tau, d, fr, b), end = d - 3; sky(c, K.deep, '#3c1f66', 11, tau);
  shot(c, tau, d, () => { ground(c, 1420, '#2b1d5e');
    if (b === 0) { clockFace(c, CX, 560, 170, tau, 1, t / .4); bean(c, CX, 1080, 1.3, tau, { shirt: K.pink, skin: K.skins[0], arm: 1, look: 0, t: t / .4 }); T(c, '¿Y qué haces con él?', CX, 1350, (t - .8) / .5, { size: 68 }); }
    if (b === 1) { rr(c, 90, 480, 420, 560, 40, '#4b4f8f'); rr(c, 570, 480, 420, 560, 40, K.teal);
      T(c, 'Acelerar', 300, 560, t / .4, { size: 60 }); T(c, 'Rediseñar', 780, 560, (t - .3) / .4, { size: 60 });
      laptop(c, 300, 900, .9, tau * 3, '#8f93c4'); c.save(); c.translate(780, 720); c.scale(.42, .42); factory(c, -370, 0, 740, tau, 2, (t - .5) / .4); c.restore();
      pill(c, '¿Tú qué eliges?', CX, 1200, (t - 1.2) / .4, K.yellow, { size: 64, color: K.ink }); }
  });
  resetT(c);
  T(c, 'Voz sintética · Animación con IA (Claude) · Ilustración', CX, 1730, (tau - end) / .6, { size: 30, weight: 600, color: '#c9cdf5', sh: false });
  T(c, 'Fuentes en la descripción · Datos a 18 oct 2026', CX, 1780, (tau - end - .4) / .6, { size: 30, weight: 600, color: '#c9cdf5', sh: false });
}
socialFilm('9:16', [['r-gancho', rGancho], ['r-dinamo', rDinamo], ['r-solow', rSolow], ['r-redisenar', rRedisenar], ['r-cierre', rCierre]]);
</script>
