<style>

  #ui{position:absolute;left:0;right:0;bottom:0;height:128px;display:flex;align-items:center;gap:22px;padding:0 40px;box-sizing:border-box;

  #track::before{content:"";position:absolute;left:0;right:0;top:-30px;bottom:-30px}
  #fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:8px;background:#fff}

  @keyframes nudge{50%{transform:scale(1.15);box-shadow:0 0 0 10px rgba(255,210,63,.6)}}
  .tick{position:absolute;top:-4px;width:4px;height:24px;background:rgba(0,0,0,.45);border-radius:2px}

<body>

</defs></svg>
<script>
"use strict";
const NS = "http://www.w3.org/2000/svg", W = 1080, H = 1920, TR = 0.8;
const SERIF = "'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman','Liberation Serif','Noto Serif','DejaVu Serif',serif";
const SANS = "'Helvetica Neue',Helvetica,Arial,'Liberation Sans','Noto Sans','DejaVu Sans',sans-serif";
const MONO = "'Courier New',Courier,'Liberation Mono','DejaVu Sans Mono',monospace";
const INK = "#141414", RED = "#E8402A", BLUE = "#2443D6";

// ---------- small math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eo = x => 1 - Math.pow(1 - x, 3);
const ei = x => x * x * x;
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eb = x => { const c1 = 1.9, c3 = c1 + 1; return x <= 0 ? 0 : x >= 1 ? 1 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rng(seed) { let s = (seed * 2654435761) >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
const fmt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");

// ---------- svg helpers ----------
function E(tag, a, p) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; }
function T(p, str, x, y, o = {}) {
  const e = E("text", { x, y, "font-family": o.f || SANS, "font-size": o.s || 40, "font-weight": o.w || 700, fill: o.c || INK,
    "text-anchor": o.a || "start", ...(o.i ? { "font-style": "italic" } : {}), ...(o.ls != null ? { "letter-spacing": o.ls } : {}) }, p);
  e.textContent = str; return e;
}
const pts2d = pts => "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L") + "Z";
function torn(x, y, w, h, seed, j = 9, step = 20) {
  const r = rng(seed), pts = [];
  const edge = (x0, y0, x1, y1) => {
    const L = Math.hypot(x1 - x0, y1 - y0), n = Math.max(2, Math.round(L / step)), nx = -(y1 - y0) / L, ny = (x1 - x0) / L;
    for (let i = 0; i < n; i++) { const f = i / n, o = (r() - .5) * 2 * j; pts.push([x0 + (x1 - x0) * f + nx * o, y0 + (y1 - y0) * f + ny * o]); }
  };
  edge(x, y, x + w, y); edge(x + w, y, x + w, y + h); edge(x + w, y + h, x, y + h); edge(x, y + h, x, y);
  return pts2d(pts);
}
// a torn paper piece: rough white margin + coloured sheet + soft shadow
function paper(g, x, y, w, h, o = {}) {
  const seed = o.seed || 1, gg = E("g", o.shadow === false ? {} : { filter: "url(#psh)" }, g);
  E("path", { d: torn(x - 11, y - 11, w + 22, h + 22, seed + 7, o.j || 7, 15), fill: o.edge || "#fff" }, gg);
  E("path", { d: torn(x, y, w, h, seed, (o.j || 7) * .45, 26), fill: o.fill || "url(#gPaper)" }, gg);
  return gg;
}
// self-drawing stroke
function drawable(path) {
  let L = null;
  return { el: path, set(p) {
    if (L == null) { L = path.getTotalLength() || 1; path.style.strokeDasharray = L + " " + (L + 2); }
    path.style.strokeDashoffset = (L * (1 - clamp(p))).toFixed(1); path.style.opacity = p > 0 ? 1 : 0;
  } };
}
const stroke = (c, w) => ({ fill: "none", stroke: c, "stroke-width": w, "stroke-linecap": "round", "stroke-linejoin": "round" });
function hcircle(g, cx, cy, rx, ry, o = {}) {
  const r = rng(o.seed || 3), a0 = -2.2 + r() * .6, turns = 1.12, n = 70, ph = r() * 6; let d = "";
  for (let i = 0; i <= n; i++) { const f = i / n, a = a0 + f * turns * 2 * Math.PI, k = 1 + .045 * Math.sin(a * 2 + ph) + f * .07;
    d += (i ? "L" : "M") + (cx + Math.cos(a) * rx * k).toFixed(1) + " " + (cy + Math.sin(a) * ry * k).toFixed(1); }
  return drawable(E("path", { d, ...stroke(o.c || RED, o.w || 9) }, g));
}
function harrow(g, x0, y0, x1, y1, o = {}) {
  const bend = o.bend == null ? .22 : o.bend, mx = (x0 + x1) / 2 - (y1 - y0) * bend, my = (y0 + y1) / 2 + (x1 - x0) * bend;
  const shaft = drawable(E("path", { d: `M${x0} ${y0} Q${mx} ${my} ${x1} ${y1}`, ...stroke(o.c || RED, o.w || 8) }, g));
  const a = Math.atan2(y1 - my, x1 - mx), hl = o.hl || 34;
  const head = drawable(E("path", { d: `M${x1 - hl * Math.cos(a - .45)} ${y1 - hl * Math.sin(a - .45)} L${x1} ${y1} L${x1 - hl * Math.cos(a + .45)} ${y1 - hl * Math.sin(a + .45)}`, ...stroke(o.c || RED, o.w || 8) }, g));
  return { set(p) { shaft.set(p * 1.3); head.set((p - .72) * 3.6); } };
}
function sxf(el, cx, cy, s, r = 0, dx = 0, dy = 0) { el.setAttribute("transform", `translate(${(cx + dx).toFixed(1)} ${(cy + dy).toFixed(1)}) rotate(${r.toFixed(2)}) scale(${Math.max(s, .0001).toFixed(3)}) translate(${-cx} ${-cy})`); }

// ---------- pixel font (5x7) ----------
const FONT = (() => {
  const src = {
    A:"01110 10001 10001 11111 10001 10001 10001",B:"11110 10001 10001 11110 10001 10001 11110",C:"01110 10001 10000 10000 10000 10001 01110",
    D:"11100 10010 10001 10001 10001 10010 11100",E:"11111 10000 10000 11110 10000 10000 11111",F:"11111 10000 10000 11110 10000 10000 10000",
    G:"01110 10001 10000 10111 10001 10001 01111",H:"10001 10001 10001 11111 10001 10001 10001",I:"01110 00100 00100 00100 00100 00100 01110",
    J:"00111 00010 00010 00010 00010 10010 01100",K:"10001 10010 10100 11000 10100 10010 10001",L:"10000 10000 10000 10000 10000 10000 11111",
    M:"10001 11011 10101 10101 10001 10001 10001",N:"10001 10001 11001 10101 10011 10001 10001",O:"01110 10001 10001 10001 10001 10001 01110",
    P:"11110 10001 10001 11110 10000 10000 10000",Q:"01110 10001 10001 10001 10101 10010 01101",R:"11110 10001 10001 11110 10100 10010 10001",
    S:"01111 10000 10000 01110 00001 00001 11110",T:"11111 00100 00100 00100 00100 00100 00100",U:"10001 10001 10001 10001 10001 10001 01110",
    V:"10001 10001 10001 10001 10001 01010 00100",W:"10001 10001 10001 10101 10101 10101 01010",X:"10001 10001 01010 00100 01010 10001 10001",
    Y:"10001 10001 10001 01010 00100 00100 00100",Z:"11111 00001 00010 00100 01000 10000 11111",
    0:"01110 10001 10011 10101 11001 10001 01110",1:"00100 01100 00100 00100 00100 00100 01110",2:"01110 10001 00001 00010 00100 01000 11111",
    3:"11111 00010 00100 00010 00001 10001 01110",4:"00010 00110 01010 10010 11111 00010 00010",5:"11111 10000 11110 00001 00001 10001 01110",
    6:"00110 01000 10000 11110 10001 10001 01110",7:"11111 00001 00010 00100 01000 01000 01000",8:"01110 10001 10001 01110 10001 10001 01110",
    9:"01110 10001 10001 01111 00001 00010 01100",".":"00000 00000 00000 00000 00000 01100 01100",",":"00000 00000 00000 00000 01100 00100 01000",
    "%":"11000 11001 00010 00100 01000 10011 00011","?":"01110 10001 00001 00010 00100 00000 00100","-":"00000 00000 00000 11111 00000 00000 00000",
    ":":"00000 01100 01100 00000 01100 01100 00000","¿":"00100 00000 00100 01000 10000 10001 01110","¡":"00100 00000 00100 00100 00100 00100 00100","!":"00100 00100 00100 00100 00100 00000 00100"," ":"00000 00000 00000 00000 00000 00000 00000"
  };
  const f = {}; for (const k in src) f[k] = src[k].split(" "); return f;
})();
const pixW = (str, px) => str.length * 6 * px - px;
function pix(g, str, x, y, px, fill, anchor) {
  if (anchor === "middle") x -= pixW(str, px) / 2;
  let d = "", cx = x;
  const ACC = { "Á": "A", "É": "E", "Í": "I", "Ó": "O", "Ú": "U", "Ñ": "N" };
  for (const ch of str.toUpperCase()) { const gl = FONT[ACC[ch] || ch] || FONT[" "];
    if (ACC[ch]) for (const [r, c] of ch === "Ñ" ? [[-2, 1], [-2, 2], [-2, 4], [-3, 3], [-3, 0]] : [[-2, 2], [-3, 3]]) d += `M${cx + c * px} ${y + r * px}h${px}v${px}h${-px}z`;
    gl.forEach((row, r) => { for (let c = 0; c < 5; c++) if (row[c] === "1") d += `M${cx + c * px} ${y + r * px}h${px}v${px}h${-px}z`; });
    cx += 6 * px; }
  return E("path", { d, fill }, g);
}

// ---------- measuring text for fitting ----------
const mctx = document.createElement("canvas").getContext("2d");
function textW(str, size, font, italic, weight = 700) { mctx.font = `${italic ? "italic " : ""}${weight} ${size}px ${font}`; return mctx.measureText(str).width; }

// ---------- scene machinery ----------
const scenesEl = document.getElementById("scenes"), fx = document.getElementById("fx");
const SCENES = [];
let UID = 0;

function makeScene(def) {
  const el = document.createElement("div"); el.className = "scene"; el.style.background = def.bg; scenesEl.appendChild(el);
  const stripD = document.createElement("div"), backD = document.createElement("div"), subD = document.createElement("div"), frontD = document.createElement("div");
  el.append(backD, stripD, subD, frontD);
  const S = { def, el, pieces: [], subX: 0, subY: 0, subR: 0 };
  const holders = { back: backD, strip: stripD, sub: subD, front: frontD };
  S.layer = (kind, x, y, w, h, cls) => {
    const s = E("svg", { viewBox: `${x} ${y} ${w} ${h}`, width: w, height: h });
    s.style.left = x + "px"; s.style.top = y + "px"; if (cls) s.setAttribute("class", cls);
    holders[kind].appendChild(s); return s;
  };
  // pieces: entrance + idle sway (nothing stays still)
  S.piece = (el, o) => { S.pieces.push({ el, at: 0.4, from: "pop", dist: 1300, dur: .6, r: 0, k: S.pieces.length, ...o }); return el; };

  // torn strip, tilted 13 degrees, with the big italic word
  const st = def.strip, sw = 1760, sh = st.h || 320;
  const sl = S.layer("strip", st.cx - 1000, st.cy - 520, 2000, 1040, "sh");
  const g = E("g", { transform: `rotate(-13 ${st.cx} ${st.cy})` }, sl);
  const seed = 40 + UID * 13;
  E("path", { d: torn(st.cx - sw / 2 - 16, st.cy - sh / 2 - 16, sw + 32, sh + 32, seed + 3, 12, 14), fill: "#fff" }, g);
  const body = torn(st.cx - sw / 2, st.cy - sh / 2, sw, sh, seed, 6, 24);
  E("path", { d: body, fill: st.color }, g);
  E("path", { d: body, fill: "url(#gShade)" }, g);
  const cid = "strip" + (UID++); const cp = E("clipPath", { id: cid }, g); E("path", { d: body }, cp);
  const wt = E("g", {}, E("g", { "clip-path": `url(#${cid})` }, g));
  let fs = st.size || 300; const maxW = st.maxW || 900;
  const ww = textW(st.word, fs, SERIF, true); if (ww > maxW) fs *= maxW / ww;
  T(wt, st.word, st.cx + (st.wx || 0), st.cy + fs * .33 + (st.wy || 0), { f: SERIF, s: fs.toFixed(0), i: 1, w: 700, c: st.wordColor, a: "middle", ls: (-fs * .015).toFixed(1) });
  S.strip = { sl, wt };

  // subject layer (cut-out look)
  const sb = def.sub; S.sub = S.layer("sub", sb.x, sb.y, sb.w, sb.h, "cut");
  // label: black tag, pixel font, one word
  if (def.label) {
    const L = def.label, px = L.px || 7, pad = 18, w = pixW(L.text, px) + pad * 2, h = 7 * px + pad * 2;
    const ls = S.layer("front", L.x, L.y, w, h, "sh");
    E("rect", { x: L.x, y: L.y, width: w, height: h, fill: "#111" }, ls);
    pix(ls, L.text, L.x + pad, L.y + pad, px, "#fff");
    S.label = ls;
  }
  S.update = def.build(S) || (() => {});
  SCENES.push(S);
  return S;
}

function placePiece(p, t) {
  const q = seg(t, p.at, p.at + p.dur), e = eb(q);
  let x = 0, y = 0, s = 1;
  if (p.from === "left") x = -(1 - e) * p.dist; else if (p.from === "right") x = (1 - e) * p.dist;
  else if (p.from === "top") y = -(1 - e) * p.dist; else if (p.from === "bottom") y = (1 - e) * p.dist; else s = e;
  const k = p.k * 1.7;
  const r = p.r + Math.sin(t * 1.25 + k) * .8; y += Math.sin(t * 1.6 + k) * 3.5;
  p.el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${r.toFixed(2)}deg) scale(${s.toFixed(3)})`;
  p.el.style.visibility = t < p.at ? "hidden" : "visible";
}

function updateScene(S, t) {
  const d = S.def, st = d.strip, dir = st.from || -1;
  S.update(t, d.dur);
  // strip slides in from the side, then drifts
  const sp = eb(seg(t, .08, .78));
  S.strip.sl.style.transform = `translate(${(dir * 1500 * (1 - sp) + Math.sin(t * .7) * 9).toFixed(1)}px,${(Math.sin(t * .9 + 1) * 5).toFixed(1)}px)`;

// ---------- timeline ----------
const VOICE = window.VOICE || null;   // { lead, durs: [...], audio: "data:..." } when narrated
const words = s => s.split(/\s+/).filter(Boolean).length;
let acc = 0;
DEF.forEach((d, i) => {
  const n = d.cap.reduce((a, s) => a + words(s), 0);
  const v = VOICE && VOICE.durs[i];
  d.dur = d.dur || (v ? Math.max(8.5, v + VOICE.lead + 1.0) : Math.max(8.5, 1.9 + n / 2.7));
  d.start = i ? acc - TR : 0; acc = d.start + d.dur;
  // captions: comfortable reading, split by word count, the last chunk never shorter than 2.6 s
  const a = v ? VOICE.lead - .1 : .55, b = v ? Math.min(d.dur - .25, VOICE.lead + v + .6) : d.dur - .25, tot = Math.max(1, n); let c = a;
  d.capT = d.cap.map((s, k) => { const share = (b - a) * words(s) / tot; const o = { s, t0: c, t1: c + share }; c += share; return o; });
  if (d.capT.length > 1) { const last = d.capT[d.capT.length - 1]; const need = 2.6 - (last.t1 - last.t0); if (need > 0) { last.t0 -= need; d.capT[d.capT.length - 2].t1 -= need; } }

});
const TOTAL = acc;

// ---------- transitions: torn paper wipe ----------
const edgeShadow = E("polyline", { fill: "none", stroke: "rgba(0,0,0,.25)", "stroke-width": 20, "stroke-linejoin": "round" }, fx);
const edgeWhite = E("polyline", { fill: "none", stroke: "#fff", "stroke-width": 14, "stroke-linejoin": "round" }, fx);
const jagCache = {};
function jags(i, n) { if (!jagCache[i]) { const r = rng(500 + i); jagCache[i] = Array.from({ length: n }, () => (r() - .5) * 44); } return jagCache[i]; }
function transition(S, i, t) {
  if (i === 0 || t >= TR) { S.el.style.clipPath = "none"; S.el.style.webkitClipPath = "none"; return null; }
  const p = eio(seg(t, 0, TR)), type = S.def.tr, pts = [];
  if (type === "up") {
    const e = H + 90 - p * (H + 220), J = jags(i, 25);
    for (let k = 0; k < 25; k++) { const x = -40 + k * 48; pts.push([x, e + J[k] + (x - W / 2) * .12]); }
    var poly = [...pts, [W + 60, H + 400], [-60, H + 400]], sh = [0, -10];
  } else {
    const L = type === "left", e = L ? W + 90 - p * (W + 220) : -90 + p * (W + 220), J = jags(i, 42);
    for (let k = 0; k < 42; k++) { const y = -40 + k * 48; pts.push([e + J[k] + (y - H / 2) * .16, y]); }
    var poly = L ? [...pts, [W + 600, H + 60], [W + 600, -60]] : [...pts, [-600, H + 60], [-600, -60]], sh = [L ? -10 : 10, 0];
  }
  const cp = "polygon(" + poly.map(q => q[0].toFixed(0) + "px " + q[1].toFixed(0) + "px").join(",") + ")";
  S.el.style.clipPath = cp; S.el.style.webkitClipPath = cp;
  return { pts, sh };
}

// ---------- captions ----------
const capP = document.querySelector("#cap p"); let capNow = null;
function captions(T_) {
  let c = null, ct = 0;
  for (const d of DEF) { const t = T_ - d.start; if (t < 0 || t >= d.dur) continue; for (const o of d.capT) if (t >= o.t0 && t < o.t1) { c = o; ct = t; } }
  if (c !== capNow) { capNow = c; capP.innerHTML = c ? "<span>" + c.s.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</span>" : ""; }
  if (c) { const k = eo(seg(ct, c.t0, c.t0 + .25)), out = 1 - seg(ct, c.t1 - .15, c.t1); capP.style.opacity = Math.min(k, out); capP.style.transform = `translateY(${((1 - k) * 18).toFixed(1)}px)`; }
}

// ---------- paper grain (generated, no image files) ----------
(() => { const c = document.createElement("canvas"); c.width = c.height = 220; const x = c.getContext("2d"), im = x.createImageData(220, 220), r = rng(7);
  for (let i = 0; i < im.data.length; i += 4) { const v = r(), dark = v < .5; im.data[i] = im.data[i + 1] = im.data[i + 2] = dark ? 0 : 255; im.data[i + 3] = Math.floor(r() * (dark ? 20 : 14)); }
  x.putImageData(im, 0, 0); document.getElementById("grain").style.backgroundImage = `url(${c.toDataURL()})`; })();
const grain = document.getElementById("grain");

// ---------- render ----------
function render(T_) {
  let edge = null;
  SCENES.forEach((S, i) => {
    const d = S.def, t = T_ - d.start, on = t >= 0 && t < d.dur || (i === SCENES.length - 1 && T_ >= d.start);
    S.el.style.display = on ? "block" : "none";
    if (!on) return;
    const tt = Math.min(t, d.dur);
    const e = transition(S, i, tt); if (e) edge = e;
    updateScene(S, tt);
  });
  if (edge) { const s = edge.pts.map(q => q[0].toFixed(0) + "," + q[1].toFixed(0)).join(" "); edgeWhite.setAttribute("points", s);
    edgeShadow.setAttribute("points", edge.pts.map(q => (q[0] + edge.sh[0]).toFixed(0) + "," + (q[1] + edge.sh[1]).toFixed(0)).join(" "));
    edgeWhite.style.display = edgeShadow.style.display = "inline"; }
  else edgeWhite.style.display = edgeShadow.style.display = "none";
  const gs = Math.floor(T_ * 10); grain.style.transform = `translate(${(gs * 37) % 40}px,${(gs * 23) % 40}px)`;
  captions(T_);
  fill.style.width = (100 * T_ / TOTAL).toFixed(2) + "%";
}

// ---------- player ----------
const stage = document.getElementById("stage"), fill = document.getElementById("fill"), track = document.getElementById("track");
const playBtn = document.getElementById("play");
const ICON_PAUSE = '<svg viewBox="0 0 40 40"><rect x="9" y="7" width="8" height="26" rx="2" fill="#111"/><rect x="23" y="7" width="8" height="26" rx="2" fill="#111"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 40 40"><path d="M12 6 L34 20 L12 34 Z" fill="#111"/></svg>';
let Tnow = 0, playing = true, last = null;
let audio = null, muted = false, blocked = false;
if (VOICE) { audio = new Audio(); audio.preload = "auto"; fetch(VOICE.audio).then(r => r.blob()).then(b => { audio.src = URL.createObjectURL(b); syncAudio(); }); }
function syncAudio() {
  if (!audio || !audio.src) return;
  if (playing && !muted && Tnow < TOTAL) {
    if (Math.abs(audio.currentTime - Tnow) > .25) audio.currentTime = Tnow;
    if (audio.paused) audio.play().catch(() => { blocked = true; muted = true; updSnd(); });
  } else if (!audio.paused) audio.pause();
}
function updSnd() { const b = document.getElementById("snd"); if (!b) return; b.innerHTML = muted ? ICON_MUTE : ICON_SND; b.setAttribute("aria-label", muted ? "Sound on" : "Mute"); b.classList.toggle("nudge", blocked); }
function setPlaying(p) { playing = p; last = null; syncAudio(); playBtn.innerHTML = p ? ICON_PAUSE : ICON_PLAY; playBtn.setAttribute("aria-label", p ? "Pause" : "Play"); }
function toggle() { if (!playing && Tnow >= TOTAL) Tnow = 0; setPlaying(!playing); }
function restart() { Tnow = 0; setPlaying(true); render(0); }
function seek(t) { Tnow = clamp(t, 0, TOTAL); render(Tnow); syncAudio(); }
playBtn.addEventListener("click", e => { e.stopPropagation(); toggle(); });
document.getElementById("restart").addEventListener("click", e => { e.stopPropagation(); restart(); });
document.getElementById("ui").addEventListener("click", e => e.stopPropagation());
stage.addEventListener("click", () => { if (blocked) { blocked = false; muted = false; updSnd(); setPlaying(true); } else toggle(); });
const ICON_SND = '<svg viewBox="0 0 40 40"><path d="M6 15h7l9-7v24l-9-7H6z" fill="#111"/><path d="M27 13q5 7 0 14M31 9q9 11 0 22" fill="none" stroke="#111" stroke-width="3.5" stroke-linecap="round"/></svg>';
const ICON_MUTE = '<svg viewBox="0 0 40 40"><path d="M6 15h7l9-7v24l-9-7H6z" fill="#111"/><path d="M27 14l10 12M37 14L27 26" stroke="#111" stroke-width="3.5" stroke-linecap="round"/></svg>';
if (VOICE) { const b = document.createElement("button"); b.id = "snd"; document.getElementById("ui").insertBefore(b, track);
  b.addEventListener("click", e => { e.stopPropagation(); blocked = false; muted = !muted; updSnd(); syncAudio(); }); updSnd(); }
let dragging = false;
const seekFromEvent = e => { const r = track.getBoundingClientRect(); seek(TOTAL * clamp((e.clientX - r.left) / r.width)); };
track.addEventListener("pointerdown", e => { dragging = true; track.setPointerCapture(e.pointerId); seekFromEvent(e); });
track.addEventListener("pointermove", e => { if (dragging) seekFromEvent(e); });
track.addEventListener("pointerup", () => dragging = false);
document.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); toggle(); } else if (e.key === "r" || e.key === "R") restart();
  else if (e.key === "ArrowRight") seek(Tnow + 5); else if (e.key === "ArrowLeft") seek(Tnow - 5); });
DEF.forEach((d, i) => { if (i) { const k = document.createElement("div"); k.className = "tick"; k.style.left = (100 * d.start / TOTAL) + "%"; track.appendChild(k); } });
function fit() { const s = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - H * s) / 2}px) scale(${s})`; }
addEventListener("resize", fit); fit();
function frame(now) {
  if (playing) { if (audio && !audio.paused && !muted && audio.currentTime > 0) Tnow = audio.currentTime; else if (last != null) Tnow += Math.min(.1, (now - last) / 1000); last = now;
    if (Tnow >= TOTAL) { Tnow = TOTAL; setPlaying(false); } render(Tnow); }
  requestAnimationFrame(frame);
}
// ?t=12.5 opens paused on that moment (for checking frames)
const q = new URLSearchParams(location.search);
window.__seek = t => { setPlaying(false); seek(t); };
window.__total = TOTAL;
if (q.has("t")) { setPlaying(false); seek(parseFloat(q.get("t"))); } else { setPlaying(true); render(0); }
requestAnimationFrame(frame);
