setPalette('neon');

}

}

function sTao(c, tau) {

  if (b === 0) { glassTile(c, 460, 360, 1000, 240, C.violet, t * 2); typeGlow(c, 'Terence Tao', CX, 500, (t - .3) / 1, { size: 96, accent: C.violet });

    label(c, 'la IA acelera los dos primeros, no el tercero', CX, 830, t - 3, 42, PAL.ink); }

    typeGlow(c, '¿Qué motivará', 1300, 420, (t - .6) / .8, { size: 70, accent: C.pink }); typeGlow(c, 'a un estudiante?', 1300, 520, (t - 1.4) / .8, { size: 70, accent: C.pink });

function sFuturo(c, tau) {

    label(c, 'ANA predice turbulencias que el radar no ve', CX, 840, t - 1.6, 38, PAL.ink); }

function sCierre(c, tau) {
  const d = D('cierre'), fr = [.3, .56], b = beatOf(tau, d, fr), t = since(tau, d, fr, b), end = d - 6.5; blackFrame(c); hue(c, 'cierre', tau);
