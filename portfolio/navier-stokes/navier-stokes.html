<canvas id="c"></canvas>

<script src="core.js"></script>
<script>
/* OpenAI's Navier-Stokes claim (8 Sep 2026) and the Buckmaster–Alpöge credit dispute. ~3.5 min, 16:9, Spanish.
   Palette: blue and red on white only. People appear as name cards, never drawn. Allegations are labelled
   "según Buckmaster" and followed by OpenAI's response at equal length; verification status stated plainly.
   Conflict of interest disclosed: made with Claude (Anthropic), Alpöge's employer. Sources in descripcion.md. */
usePalette(makePalette({ paper: '#ffffff', paperBand: null, ink: '#16307a' }, 'paperInk'));   // only blue, red and white
const C = { blue: '#1f4fd1', red: '#e5322d', lblue: '#e6eeff', lred: '#ffe8e7', navy: '#16307a' };
const RAINBOW = [C.blue, C.red];
const FONT = '"Comic Neue", "Comic Sans MS", cursive';
const D = id => window.SECTION_DURS[id];

// ---------- lettering ----------
function txt(c, s, x, y, o = {}) {
  const { size = 56, weight = 700, color = PAL.ink, align = 'center', prog = 1, rainbow = false, bg = false } = o;
  const n = Math.ceil(s.length * clamp(prog, 0, 1)); if (!n) return;
  c.save(); c.font = `${weight} ${size}px ${FONT}`; c.textBaseline = 'alphabetic';
  const w = c.measureText(s.slice(0, n)).width, x0 = align === 'center' ? x - c.measureText(s).width / 2 : align === 'right' ? x - w : x;
  if (bg) { c.fillStyle = '#ffffff'; c.fillRect(x0 - 12, y - size * .95, (align === 'center' ? c.measureText(s).width : w) + 24, size * 1.25); }
  if (!rainbow) { c.textAlign = 'left'; c.fillStyle = color; c.fillText(s.slice(0, n), x0, y); c.restore(); return; }
  let cx = x0; c.textAlign = 'left';
  for (let i = 0; i < n; i++) { c.fillStyle = s[i] === ' ' ? PAL.ink : RAINBOW[i % RAINBOW.length]; c.fillText(s[i], cx, y); cx += c.measureText(s[i]).width; }
  c.restore();
}
const type = (tau, a, b) => sm(a, b, tau, x => x);
function caption(c, lines, tau, t0, dur = 1.8, t1 = Infinity, o = {}) {
  if (tau < t0 - .3 || tau > t1) return;
  const { size = 50, y0 = 958 } = o, lh = size * 1.25, total = lines.reduce((a, l) => a + l.length, 0);
  resetT(c); const f = sm(t0 - .3, t0, tau) * (1 - sm(t1 - .3, t1, tau));
  c.save(); c.globalAlpha = .95 * f; c.fillStyle = '#ffffff'; c.fillRect(0, y0 - size * 1.1, W, lh * lines.length + size * .5);
  c.globalAlpha = f; let acc = 0;
  lines.forEach((l, k) => { const a = acc / total, b = (acc + l.length) / total; acc += l.length;
    txt(c, l, CX, y0 + k * lh, { size, prog: sm(t0 + a * dur, t0 + b * dur, tau, x => x) }); });
  c.restore();
}

// ---------- line art with flat colour fills ----------
function drawArt(c, strokes, prog, seed, o = {}) {
  const { amp = 1.4, width = 3.4 } = o, L = strokes.map(s => pathLength(s.p, s.close)), tot = L.reduce((a, b) => a + b, 0) || 1;
  let acc = 0; c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
  strokes.forEach((st, k) => {
    const a = acc / tot, b = (acc + L[k]) / tot; acc += L[k];
    const p = clamp((prog - a) / Math.max(1e-6, b - a), 0, 1); if (p <= 0) return;
    if (st.fill && st.close) { const fp = sm(.75, 1, p); if (fp > 0) { c.save(); c.globalAlpha = .92 * fp; c.fillStyle = st.fill; c.beginPath();
      st.p.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); c.fill(); c.restore(); } }
    c.strokeStyle = st.col || PAL.ink; c.lineWidth = st.w || width;
    if (st.dash) c.setLineDash(st.dash); else c.setLineDash([]);
    if (p >= 1) wob(c, st.p, amp, seed + k, !!st.close, { pressure: .45 }); else selfDraw(c, st.p, p, seed + k, amp, !!st.close);
  });
  c.setLineDash([]); c.restore();
}
const S_ = (p, o = {}) => ({ p, ...o });
const box = (x, y, w, h, o) => S_(rectPts(x, y, w, h), { close: true, ...o });
const ln = (x0, y0, x1, y1, o) => S_([[x0, y0], [x1, y1]], o);
const circ = (x, y, r, o) => S_(ellPts(x, y, r, r, 0, 36), { close: true, ...o });
function arrow(x0, y0, x1, y1, o = {}) { const h = o.head ?? 24, a = Math.atan2(y1 - y0, x1 - x0);
  return S_([[x0, y0], [x1, y1], [x1 - h * Math.cos(a - .45), y1 - h * Math.sin(a - .45)], [x1, y1], [x1 - h * Math.cos(a + .45), y1 - h * Math.sin(a + .45)]], o); }
function push(c, tau, dur, z1 = 1.035) { cam(c, CX, CY, lerp(1, z1, sm(0, dur, tau, easeInOutSine))); }
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');   // 1.200 / 70.000 (Spanish grouping)
const fade = (tau, a, b) => sm(a - .4, a + .2, tau) * (1 - sm(b - .4, b + .2, tau));

// ---------- props ----------
// a small agent robot: head, antenna, two eyes; colour by index
function robot(x, y, s = 1, col = C.blue) { return [box(x - 34 * s, y - 28 * s, 68 * s, 56 * s, { fill: col, w: 3 }), ln(x, y - 28 * s, x, y - 48 * s, { w: 3 }), circ(x, y - 54 * s, 7 * s, { fill: C.yellow, w: 2.4 }),
  circ(x - 14 * s, y - 6 * s, 7 * s, { fill: '#ffffff', w: 2 }), circ(x + 14 * s, y - 6 * s, 7 * s, { fill: '#ffffff', w: 2 }), ln(x - 12 * s, y + 14 * s, x + 12 * s, y + 14 * s, { w: 2.6 })]; }
function server(x, y, col = C.grey, label) { const s = [box(x - 110, y - 150, 220, 300, { fill: '#f2f4f8', w: 4 })];
  for (let k = 0; k < 4; k++) { s.push(box(x - 90, y - 130 + k * 70, 180, 52, { fill: col, w: 2.6 }), circ(x + 62, y - 104 + k * 70, 7, { fill: C.green, w: 2 })); } return s; }
function cloud(x, y, col = C.blue) { const p = []; [[-110, 0, 60], [-50, -40, 70], [30, -50, 75], [100, -10, 60], [20, 30, 70], [-70, 35, 55]].forEach(([dx, dy, r]) => {
  for (let a = 0; a <= TAU; a += .3) p.push([x + dx + Math.cos(a) * r, y + dy + Math.sin(a) * r * .75]); });
  return [S_(ellPts(x, y, 175, 85, 0, 48), { close: true, fill: '#e8f1ff', w: 4, col })]; }
function cylinder(x, y, col) { return [box(x - 80, y - 60, 160, 140, { fill: col, w: 3.4 }), S_(ellPts(x, y - 60, 80, 24, 0, 30), { close: true, fill: '#ffffff', w: 3.4 }),
  S_(ellPts(x, y + 80, 80, 24, 0, 30).slice(0, 16), { w: 3.4 })]; }
function warn(x, y, s = 1) { return [S_([[x, y - 60 * s], [x + 66 * s, y + 52 * s], [x - 66 * s, y + 52 * s]], { close: true, fill: C.yellow, w: 4 }), ln(x, y - 22 * s, x, y + 16 * s, { w: 7 }), circ(x, y + 34 * s, 5 * s, { fill: PAL.ink, w: 2 })]; }
function check(x, y, col = C.green) { return [circ(x, y, 46, { fill: col, w: 3.4 }), S_([[x - 22, y], [x - 6, y + 18], [x + 24, y - 20]], { w: 7, col: '#ffffff' })]; }
function cross(x, y, col = C.red) { return [circ(x, y, 46, { fill: col, w: 3.4 }), ln(x - 18, y - 18, x + 18, y + 18, { w: 7, col: '#ffffff' }), ln(x + 18, y - 18, x - 18, y + 18, { w: 7, col: '#ffffff' })]; }
function bubble(x, y, w, h, col, tailLeft = true) { const t = tailLeft ? [[x + 40, y + h], [x + 20, y + h + 40], [x + 80, y + h]] : [[x + w - 80, y + h], [x + w - 20, y + h + 40], [x + w - 40, y + h]];
  return [S_([[x, y], [x + w, y], [x + w, y + h], ...(tailLeft ? [] : t), ...(tailLeft ? [[x + 80, y + h], [x + 20, y + h + 40], [x + 40, y + h]] : []), [x, y + h]], { close: true, fill: col, w: 3.4 })]; }

// ---------- scenes ----------
const BLUE = C.blue, RED = C.red;
function card(c, x, y, w, h, fill, col, prog, seed) { drawArt(c, [box(x, y, w, h, { fill, w: 4, col })], prog, seed); }
function bullet(c, s, x, y, prog, col = PAL.ink, size = 42) { if (prog <= 0) return; c.save(); c.fillStyle = col; c.beginPath(); c.arc(x, y - size * .32, 9, 0, TAU); c.fill(); c.restore(); txt(c, s, x + 30, y, { size, weight: 400, align: 'left', prog }); }
function streams(c, tau, t0, t1) { const p = sm(t0, t1, tau);
  for (let k = 0; k < 7; k++) { const y0 = 330 + k * 60, pts = []; for (let x = 160; x <= 1760; x += 20) { const bump = Math.exp(-((x - 900) ** 2) / 60000) * (k < 3.5 ? -1 : 1) * (70 - Math.abs(k - 3) * 18); pts.push([x, y0 + bump + Math.sin(x / 120 + k + tau * 1.5) * 6]); }
    const n = Math.max(2, Math.floor(pts.length * clamp(p * 1.4 - k * .06, 0, 1))); c.save(); c.strokeStyle = k % 3 === 1 ? RED : BLUE; c.lineWidth = 3; c.beginPath(); pts.slice(0, n).forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.stroke(); c.restore(); } }
function vortex(c, x, y, r, tau, prog, col = RED) { if (prog <= 0) return; const turns = 4 + tau * .8, pts = [];
  for (let a = 0; a < turns * TAU * prog; a += .08) { const rr = r * Math.exp(-a / (turns * 1.6)); pts.push([x + Math.cos(a + tau * 2) * rr, y + Math.sin(a + tau * 2) * rr]); }
  c.save(); c.strokeStyle = col; c.lineWidth = 4; c.beginPath(); pts.forEach(([px, py], i) => i ? c.lineTo(px, py) : c.moveTo(px, py)); c.stroke(); c.restore(); }

function sGancho(c, tau) {
  const d = D('gancho'); paper(c); push(c, tau, d);
  txt(c, '¿La IA resolvió', CX, 220, { size: 104, color: BLUE, prog: type(tau, .2, 1.4) });
  txt(c, 'un Problema del Milenio?', CX, 350, { size: 104, color: RED, prog: type(tau, 1.2, 2.6) });
  vortex(c, 560, 640, 170, tau, sm(2, 5, tau), BLUE);
  card(c, 1060, 540, 560, 200, C.lred, RED, sm(d * .3, d * .3 + 1, tau, easeOut), 10);
  txt(c, '1.000.000 $', 1340, 665, { size: 84, color: RED, prog: type(tau, d * .32, d * .32 + 1) });
  caption(c, ['8 de septiembre de 2026: OpenAI anuncia una demostración'], tau, .8, 2.2, d * .55);
  caption(c, ['…y llega acompañada de una acusación'], tau, d * .57, 1.8);
}
function sProblema(c, tau) {
  const d = D('problema'), b = d * .55; paper(c); push(c, tau, d);
  txt(c, 'Navier-Stokes: cómo se mueven los fluidos', CX, 180, { size: 62, color: BLUE, prog: type(tau, .2, 1.6) });
  if (tau < b + .5) { c.save(); c.globalAlpha = 1 - sm(b - .4, b + .5, tau); streams(c, tau, .6, 4);
    drawArt(c, [S_(ellPts(900, 510, 210, 46, -.08, 40), { close: true, fill: C.lblue, w: 4 })], sm(1.4, 2.6, tau, easeOut), 20); c.restore();
    caption(c, ['Agua, aire, humo: ingeniería de todos los días'], tau, .8, 2, b); }
  if (tau > b - .2) { const f = sm(b - .2, b + .4, tau); c.save(); c.globalAlpha = f;
    vortex(c, 620, 560, 260, tau, sm(b, b + 3, tau), RED);
    txt(c, '¿Pueden explotar', 1330, 470, { size: 70, color: RED, prog: type(tau, b + .8, b + 1.8) });
    txt(c, 'en tiempo finito?', 1330, 560, { size: 70, color: RED, prog: type(tau, b + 1.4, b + 2.4) });
    txt(c, 'Instituto Clay · año 2000', 1330, 680, { size: 46, color: BLUE, prog: type(tau, d * .8, d * .8 + 1.2) }); c.restore();
    caption(c, ['Volverse infinitas: nadie lo había demostrado'], tau, b + .4, 1.8); }
}
const DOTS = (() => { const r = rng(5), p = []; for (let k = 0; k < 600; k++) p.push([160 + r() * 820, 220 + r() * 560, r()]); return p; })();
function sAnuncio(c, tau) {
  const d = D('anuncio'); paper(c); push(c, tau, d);
  const g = sm(.6, d * .35, tau);
  DOTS.forEach(([x, y, o], k) => { if (o > g) return; c.save(); c.fillStyle = k % 9 === 0 ? RED : BLUE; c.globalAlpha = .85; c.beginPath(); c.arc(x, y, 5, 0, TAU); c.fill(); c.restore(); });
  txt(c, `≈${fmt(Math.round(10000 * g))} agentes`, 1400, 300, { size: 70, color: BLUE, prog: type(tau, .6, .8) });
  txt(c, `≈${Math.round(88 * sm(.6, d * .35, tau))} horas`, 1400, 400, { size: 70, color: RED, prog: type(tau, .8, 1) });
  const t = d * .4;
  for (let k = 0; k < 5; k++) card(c, 1180 + k * 14, 480 + k * 14, 300, 340, k === 4 ? '#ffffff' : C.lblue, BLUE, sm(t + k * .12, t + .6 + k * .12, tau), 30 + k);
  txt(c, '165', 1386, 640, { size: 96, color: BLUE, prog: type(tau, t + .8, t + 1.4) }); txt(c, 'páginas', 1386, 700, { size: 42, color: BLUE, prog: type(tau, t + 1, t + 1.6) });
  card(c, 1560, 520, 230, 120, C.lblue, BLUE, sm(d * .6, d * .6 + .8, tau, easeOut), 40);
  txt(c, 'Lean ✓', 1675, 600, { size: 54, color: BLUE, prog: type(tau, d * .62, d * .62 + .8) });
  card(c, 1560, 680, 230, 120, C.lred, RED, sm(d * .82, d * .82 + .8, tau, easeOut), 41);
  txt(c, 'sin premio', 1675, 755, { size: 40, color: RED, prog: type(tau, d * .84, d * .84 + .8) });
  caption(c, ['Según OpenAI: sí, pueden explotar'], tau, .6, 1.6, d * .5);
  caption(c, ['Lean: un lenguaje que verifica cada paso lógico'], tau, d * .58, 2);
}
function sMatematicos(c, tau) {
  const d = D('matematicos'); paper(c); push(c, tau, d);
  card(c, 160, 220, 700, 220, C.lblue, BLUE, sm(.4, 1.4, tau, easeOut), 50);
  txt(c, 'Tristan Buckmaster', 510, 320, { size: 58, color: BLUE, prog: type(tau, 1, 2) }); txt(c, 'matemático', 510, 390, { size: 40, weight: 400, prog: type(tau, 1.6, 2.4) });
  card(c, 1060, 220, 700, 220, C.lblue, BLUE, sm(1.2, 2.2, tau, easeOut), 51);
  txt(c, 'Levent Alpöge', 1410, 320, { size: 58, color: BLUE, prog: type(tau, 1.8, 2.8) }); txt(c, 'matemático · trabaja en Anthropic', 1410, 390, { size: 40, weight: 400, prog: type(tau, 2.4, 3.4) });
  drawArt(c, [arrow(900, 470, 900, 560, { w: 4, col: RED }), arrow(1020, 470, 1020, 560, { w: 4, col: RED })], sm(d * .35, d * .35 + .8, tau), 52);
  card(c, 560, 580, 800, 230, C.lred, RED, sm(d * .4, d * .4 + 1, tau, easeOut), 53);
  txt(c, 'Euler: explosión', CX, 680, { size: 66, color: RED, prog: type(tau, d * .45, d * .45 + 1) }); txt(c, '15 de agosto · con ayuda de IA', CX, 760, { size: 42, weight: 400, prog: type(tau, d * .52, d * .52 + 1.2) });
  caption(c, ['Euler: fluidos sin viscosidad, un problema muy cercano'], tau, d * .38, 2.2);
}
function sAcusacion(c, tau) {
  const d = D('acusacion'); paper(c); push(c, tau, d);
  card(c, 140, 170, 1640, 640, C.lred, RED, sm(.2, 1.2, tau, easeOut), 60);
  txt(c, 'SEGÚN BUCKMASTER', CX, 260, { size: 64, color: RED, prog: type(tau, .6, 1.6) });
  const L = [['detalles de su trabajo llegaron a OpenAI días antes', d * .18], ['pudieron inspirar el enfoque de los agentes', d * .33], ['6 sep: presión para publicar sin Alpöge', d * .55], ['comentarios que tomó como amenazas a su carrera', d * .75]];
  L.forEach(([s, t], k) => bullet(c, s, 250, 380 + k * 105, type(tau, t, t + 1.4), k > 1 ? RED : PAL.ink, 46));
  caption(c, ['Acusaciones: OpenAI las niega'], tau, d * .1, 1.4);
}
function sRespuesta(c, tau) {
  const d = D('respuesta'); paper(c); push(c, tau, d);
  card(c, 140, 170, 1640, 640, C.lblue, BLUE, sm(.2, 1.2, tau, easeOut), 70);
  txt(c, 'SEGÚN OPENAI', CX, 260, { size: 64, color: BLUE, prog: type(tau, .6, 1.6) });
  const L = [['su método es muy distinto', d * .1], ['los rumores la animaron a atacar el problema', d * .22], ['Bubeck: quería coordinar las publicaciones', d * .38], ['Bubeck pidió disculpas por el comentario', d * .55], ['Altman: actuó con integridad; ofrecieron publicar primero', d * .72]];
  L.forEach(([s, t], k) => bullet(c, s, 250, 360 + k * 92, type(tau, t, t + 1.4), k === 3 ? RED : PAL.ink, 44));
}
function sVerificacion(c, tau) {
  const d = D('verificacion'); paper(c); push(c, tau, d);
  txt(c, '¿Es correcta?', CX, 200, { size: 96, color: RED, prog: type(tau, .2, 1.2) });
  const rows = [['Formalización en Lean', 'sí', BLUE], ['Revisión independiente', 'pendiente', RED], ['Premio Clay', 'no reclamado', BLUE]];
  rows.forEach(([a, b, col], k) => { const t = .8 + k * d * .14, y = 290 + k * 120;
    card(c, 300, y, 1320, 96, k === 1 ? C.lred : C.lblue, col, sm(t, t + .6, tau, easeOut), 80 + k);
    txt(c, a, 340, y + 64, { size: 46, align: 'left', weight: 400, prog: type(tau, t + .3, t + 1) }); txt(c, b, 1580, y + 64, { size: 48, color: col, align: 'right', prog: type(tau, t + .6, t + 1.2) }); });
  const t = d * .55;
  card(c, 300, 690, 1320, 140, '#ffffff', BLUE, sm(t, t + .8, tau, easeOut), 90);
  txt(c, 'Terence Tao: elogia a Buckmaster y Alpöge, y advierte', CX, 750, { size: 40, color: BLUE, prog: type(tau, t + .5, t + 2) });
  txt(c, 'contra «explotar» problemas abiertos sin criterio', CX, 805, { size: 40, color: BLUE, prog: type(tau, t + 1.4, t + 2.8) });
}
function sCierre(c, tau) {
  const d = D('cierre'), end = d - 7; paper(c); push(c, tau, d);
  card(c, 140, 160, 780, 300, C.lblue, BLUE, sm(.3, 1.2, tau, easeOut), 100);
  txt(c, 'CONFIRMADO', 530, 240, { size: 50, color: BLUE, prog: type(tau, .6, 1.4) });
  txt(c, 'OpenAI publicó', 530, 320, { size: 46, weight: 400, prog: type(tau, 1, 1.8) }); txt(c, 'una demostración', 530, 380, { size: 46, weight: 400, prog: type(tau, 1.4, 2.2) });
  card(c, 1000, 160, 780, 300, C.lred, RED, sm(d * .2, d * .2 + .9, tau, easeOut), 101);
  txt(c, 'EN DISPUTA', 1390, 240, { size: 50, color: RED, prog: type(tau, d * .22, d * .22 + .8) });
  txt(c, 'quién merece el crédito', 1390, 320, { size: 46, weight: 400, prog: type(tau, d * .25, d * .25 + 1) }); txt(c, 'y cómo se llegó ahí', 1390, 380, { size: 46, weight: 400, prog: type(tau, d * .28, d * .28 + 1) });
  vortex(c, CX, 600, 110, tau, sm(d * .35, d * .5, tau), BLUE);
  txt(c, '¿De quién es el descubrimiento?', CX, 790, { size: 70, color: RED, prog: type(tau, d * .42, d * .42 + 1.6) });
  resetT(c);
  txt(c, 'Hecho con Claude (Anthropic), empresa donde trabaja uno de los matemáticos · Voz sintética (Gemini TTS)', CX, 955, { size: 30, weight: 400, color: BLUE, prog: type(tau, end, end + 1.6) });
  txt(c, 'Ilustración · Acusaciones presentadas como tales, con la respuesta de OpenAI · Datos a 1 oct 2026 · Fuentes en la descripción', CX, 1005, { size: 30, weight: 400, color: BLUE, prog: type(tau, end + 1, end + 2.6) });
}
const ORDER = ['gancho', 'problema', 'anuncio', 'matematicos', 'acusacion', 'respuesta', 'verificacion', 'cierre'];
function score(ac, t0, dest) {
  const m = ac.createGain(); m.gain.value = .5; m.connect(dest);
  const total = ORDER.reduce((a, k) => a + D(k), 0); let at = 0; const starts = ORDER.map(k => { const s = at; at += D(k); return s; });
  for (let t = .4; t < total - 2; t += 1) { const k = Math.round(t), tense = t >= starts[4] && t < starts[6];
    note(ac, m, pentHz(tense ? 0 : 1, [0, 2, 4, 3, 1, 4, 2, 0][k % 8], tense ? 220 : 262), t0, t, 1.6, 'triangle', k % 4 ? .045 : .07); }
  starts.slice(1).forEach(t => note(ac, m, 131, t0, t, 2, 'sine', .14));
  [262, 330, 392].forEach(f => note(ac, m, f, t0, total - 6, 5, 'triangle', .06));
}
defineFilm({ format: { ar: '16:9', width: 1920 }, fps: 24, score, timeline: ORDER.map((id, k) =>
  ({ name: id, dur: D(id), fn: [sGancho, sProblema, sAnuncio, sMatematicos, sAcusacion, sRespuesta, sVerificacion, sCierre][k] })) });
</script>
