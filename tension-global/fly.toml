# Despliegue en Fly.io:  fly launch --no-deploy --copy-config   y luego   fly deploy
# El estado de las salas vive en memoria: usa UNA sola máquina (ver README).
app = "tension-global"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
